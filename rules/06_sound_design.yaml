schema_version: 2
domain: sound_design
rules:
  - rule_id: "SND-001"
    domain: "sound_design"
    name: "Classify a sound by its relation to the story world"
    type: "established_technique"
    priority: 2
    origin: "Film sound analysis and Chion's audiovisual framework."
    principle: "Mark whether a cue belongs to the story world, comes from outside it, or intentionally changes status. Record on-screen, off-screen and subjective access separately."
    why_it_works: "The classification helps a viewer infer who could hear the cue and how it should behave in the edit."
    when_to_apply: "Music, voice-over, environment and ambiguous cues."
    when_to_break: "A reveal can reclassify a cue, such as score that becomes a visible radio. Plan the point at which the distinction changes."
    good_example: "A melody begins as an apparent score and becomes spatially anchored when the radio is shown."
    common_mistake: "Classifying all sounds added in post as non-diegetic, including footsteps."
    ai_implementation: "Store world relation, source ID, listener, perspective and reveal or transition."
    validation: "Trace whether a character's reaction, location and sound perspective agree with the intended status."
    related_rules: ["SND-007","SND-008","SND-010"]
    source_ids: ["SRC-OSU-SOUND","SRC-CHION-AV","SRC-THOM-SND"]
    confidence: "high"
  - rule_id: "SND-002"
    domain: "sound_design"
    name: "Protect intelligibility where speech carries meaning"
    type: "established_technique"
    priority: 1
    origin: "Chion's discussion of voice and practical dialogue mixing guidance."
    principle: "Keep story-critical words and the intended performance readable. Make room through level, timing and masking control."
    why_it_works: "Audiences can follow the consequence of a line without losing the environment or the speaker's delivery."
    when_to_apply: "Dialogue, narration and audible plot information."
    when_to_break: "A line may be obscured to express distance, subjectivity or concealment. Preserve another route to essential information."
    good_example: "Reduce a competing cue during a decisive line and restore it during the pause."
    common_mistake: "Raising speech until it distorts while keeping competing sound at the same level."
    ai_implementation: "Mark essential words and intended perspective. Adjust or remove competing cues. Check several playback conditions."
    validation: "Listen at a modest level with eyes closed and confirm the needed words and intent can be understood."
    related_rules: ["SND-001","SND-003","SND-007","SND-012","SND-013"]
    source_ids: ["SRC-CHION-NOTE","SRC-ADOBE-ROOM","SRC-THOM-SND"]
    confidence: "high"
  - rule_id: "SND-003"
    domain: "sound_design"
    name: "Maintain performance and synchronization across dialogue"
    type: "continuity_convention"
    priority: 1
    origin: "Film sound practice adapted to separate generations."
    principle: "Select a coherent voice performance and align visible speech, breaths, gaps and reactions to it."
    why_it_works: "Continuity of timing and timbre makes multiple angles feel like one exchange."
    when_to_apply: "Dialogue assembled from generated takes, off-screen lines and replacement recordings."
    when_to_break: "Use voice-over, a listener shot, a cutaway or an intentionally unsynchronized style when it serves the scene."
    good_example: "Keep the chosen voice track across the reverse and cut to a listener through a difficult syllable."
    common_mistake: "Concatenating incompatible voices and trusting each clip's native audio."
    ai_implementation: "Keep a dialogue cue ID, speaker, line, take, onset, sync targets and source provenance. Use one track as the timing reference."
    validation: "Scrub visible consonant closures and line starts, then listen through the cut for voice and room jumps."
    related_rules: ["SND-002","SND-004","SND-007","SND-009","SND-013","DIR-007"]
    source_ids: ["SRC-ADOBE-ROOM","SRC-THOM-SND","SRC-ADOBE-JL"]
    confidence: "medium"
  - rule_id: "SND-004"
    domain: "sound_design"
    name: "Lay a continuous scene ambience"
    type: "continuity_convention"
    priority: 1
    origin: "Adobe's room-tone guidance and sound-design practice."
    principle: "Build a scene bed with consistent ambience or room tone. Make shifts deliberate and connect them to changes in place, time or listening perspective."
    why_it_works: "A continuous bed masks accidental holes and gives adjacent images a shared acoustic space."
    when_to_apply: "Interior coverage, repeated locations and clips with noisy native audio."
    when_to_break: "A hard acoustic break can signal a new scene or subjective shift. Choose and test it deliberately."
    good_example: "Carry a low ventilation bed through a dialogue cut and change it once the door closes."
    common_mistake: "Letting native ambience restart with every clip or looping a distinctive noise at audible intervals."
    ai_implementation: "Assign one bed per space and listening state. Use loops or crossfades with variation, and mute incompatible clip ambience."
    validation: "Listen over joins without picture and check for gaps, repeated ticks, sudden changes and level pumping."
    related_rules: ["SND-003","SND-007","SND-009","SND-011","SND-013"]
    source_ids: ["SRC-ADOBE-ROOM","SRC-ADOBE-SFX","SRC-THOM-SND"]
    confidence: "high"
  - rule_id: "SND-005"
    domain: "sound_design"
    name: "Use Foley for timed physical detail"
    type: "established_technique"
    priority: 2
    origin: "Adobe's practitioner explanation of Foley."
    principle: "Perform, select or synthesize action sounds that match timing, weight, material and perspective. Prioritize contact cues that affect the story."
    why_it_works: "A synchronized contact can establish texture, force and a sense of physical connection."
    when_to_apply: "Footsteps, fabric, handoffs and handled props."
    when_to_break: "Omit or heighten a contact for attention, humor or subjectivity. Keep the intended rhythm."
    good_example: "Give a loaded bag a heavier landing than an empty bag on the same table."
    common_mistake: "Applying the same stock footstep to different surfaces, pace and distance."
    ai_implementation: "Create a cue list with contact time, source, material, intensity and perspective. Keep clean tails for edits."
    validation: "Compare each cue with the visible contact and play the sequence without Foley to judge its contribution."
    related_rules: ["SND-004","SND-006","SND-007","SND-013","MIS-007"]
    source_ids: ["SRC-ADOBE-SFX","SRC-CHION-AV"]
    confidence: "high"
  - rule_id: "SND-006"
    domain: "sound_design"
    name: "Design effects around an event and its cause"
    type: "established_technique"
    priority: 2
    origin: "Sound-effects practice and Chion's audiovisual relationship."
    principle: "Choose or design effects by the event they identify, imply or stylize. Distinguish a recurring environment from a discrete event cue."
    why_it_works: "An effect can communicate scale, danger or function even when the source is partly or wholly unseen."
    when_to_apply: "Machines, impacts, transitions and expressive events."
    when_to_break: "Use abstract sound when literal identification would spoil a reveal or when the world has stylized rules."
    good_example: "A mechanical whine changes before a device stops, allowing the listener to anticipate failure."
    common_mistake: "Adding dense effects to every movement, burying the cue that matters."
    ai_implementation: "Record cause, onset, development, tail and who hears it. Design the cue in a separate editable track when possible."
    validation: "A listener can identify or infer the intended event and distinguish it from the background."
    related_rules: ["SND-005","SND-007","SND-008","SND-010","SND-012"]
    source_ids: ["SRC-ADOBE-SFX","SRC-CHION-AV","SRC-THOM-SND"]
    confidence: "high"
  - rule_id: "SND-007"
    domain: "sound_design"
    name: "Set an auditory point of view"
    type: "established_technique"
    priority: 1
    origin: "Thom's sound-centered point of view, with practical spatial cues."
    principle: "Choose what the audience hears from a listener's position or from a deliberately freer perspective. Use level, spectrum, occlusion, reverb and localization as needed."
    why_it_works: "Changes in listening position can reveal distance, a barrier or a character's selective attention."
    when_to_apply: "Moves between spaces, perspectives and near and far coverage."
    when_to_break: "A production can keep dialogue close through many angles to protect emotional access. Make spatial cues elsewhere coherent."
    good_example: "A sound behind a shut door loses presence and regains detail when the door opens."
    common_mistake: "Reversing spatial placement or changing reverberation with each image angle without a reason."
    ai_implementation: "Store listener ID or mix perspective, source relation, room state and planned perspective shifts."
    validation: "Listen to the scene without picture and identify whether the intended barrier or access shift is audible."
    related_rules: ["SND-001","SND-002","SND-004","SND-008","SND-009","DIR-002"]
    source_ids: ["SRC-THOM-SND","SRC-CHION-AV","SRC-ADOBE-ROOM"]
    confidence: "high"
  - rule_id: "SND-008"
    domain: "sound_design"
    name: "Use off-screen sound to extend or withhold space"
    type: "established_technique"
    priority: 2
    origin: "Thom and a close reading of Chekhov's off-stage cues."
    principle: "Give an unseen sound a plausible source or deliberate ambiguity. Decide who notices it, what it implies and whether it will be revealed."
    why_it_works: "A cue can imply activity beyond the image, redirect attention, or create anticipation without another generated shot."
    when_to_apply: "Entrances, reveals, environment and scenes of constrained viewpoint."
    when_to_break: "An unexplained sound can remain thematic or unsettling. Establish the intended uncertainty."
    good_example: "A tool drops in the next room and one character stops speaking before anyone appears."
    common_mistake: "Giving a plot-critical off-screen cue the wrong direction or leaving all listeners indifferent unintentionally."
    ai_implementation: "Record source status, cue time, spatial relation, reaction, reveal condition and any intended ambiguity."
    validation: "Check whether viewers infer the intended event or uncertainty and whether the characters react in the planned order."
    related_rules: ["SND-001","SND-006","SND-007","SND-009","SND-011","DIR-007"]
    source_ids: ["SRC-THOM-SND","SRC-CHEK-PLAY","SRC-CHION-AV"]
    confidence: "high"
  - rule_id: "SND-009"
    domain: "sound_design"
    name: "Bridge picture cuts with independently timed sound"
    type: "established_technique"
    priority: 1
    origin: "Adobe's split-edit definitions and the rulebook's scene assembly method."
    principle: "Use a J-cut to introduce the incoming cue ahead of its picture. Use an L-cut to let outgoing audio continue. A shared bed can also bridge either join."
    why_it_works: "The viewer can anticipate the next space or stay with a performance while the picture changes."
    when_to_apply: "Dialogue, scene transitions and rough-cut repair."
    when_to_break: "Cut picture and sound together for punctuation, rupture or a clean shift in place."
    good_example: "Let a line continue over the listener's reaction. Start the next room's ambience just before a planned reveal."
    common_mistake: "Making a J- or L-cut that changes the apparent cause of a sound or obscures important dialogue."
    ai_implementation: "Store cue in/out, picture cut point, carry direction and audio handles. Detach or replace native audio when necessary."
    validation: "Watch and listen through the transition. Identify which scene each audible cue belongs to and whether the overlap lands cleanly."
    related_rules: ["SND-003","SND-004","SND-007","SND-008","SND-013","DIR-014"]
    source_ids: ["SRC-ADOBE-JL","SRC-THOM-SND"]
    confidence: "high"
  - rule_id: "SND-010"
    domain: "sound_design"
    name: "Give music a relationship to the drama"
    type: "established_technique"
    priority: 2
    origin: "Chion on audiovisual perception and Thom on writing for sound."
    principle: "Decide whether music supports, counters, paces or reinterprets a beat. Choose when it enters and leaves and which voice or effect takes priority."
    why_it_works: "Music changes how the same image is understood and how duration feels."
    when_to_apply: "Score, source music, motifs and transitions."
    when_to_break: "A continuous cue can establish the form of a sequence. Check that it permits necessary variation and silence."
    good_example: "Let an established melody thin out after a refusal, leaving one audible instrument and the room."
    common_mistake: "Using a constant emotional track that states the same information as dialogue and leaves no dynamics."
    ai_implementation: "Spot entry, exit, foreground priority, relation to picture and beat references. Compare music and no-music passes."
    validation: "The cue supports the intended reading and preserves essential speech, rhythm and contrast."
    related_rules: ["SND-001","SND-002","SND-007","SND-009","SND-011","SND-012"]
    source_ids: ["SRC-CHION-AV","SRC-CHION-NOTE","SRC-THOM-SND"]
    confidence: "high"
  - rule_id: "SND-011"
    domain: "sound_design"
    name: "Distinguish dramatic silence from a missing track"
    type: "creative_heuristic"
    priority: 2
    origin: "Chekhov's staged silence and Thom's sound-design approach."
    principle: "Decide what remains audible, what falls away, and why the space or inner perspective changes."
    why_it_works: "Reducing sound can focus attention, make a cue salient or create a break in the audience's access."
    when_to_apply: "After a turn, before an off-screen cue, or when withholding music."
    when_to_break: "Absolute digital silence can be an intentional break. Confirm it survives playback and belongs at the chosen moment."
    good_example: "Remove the score and keep a breath and low room presence until a distant cue interrupts."
    common_mistake: "Muting one generated clip and leaving an accidental dead patch in otherwise continuous space."
    ai_implementation: "Mark the silence type, retained bed or deliberate zero, duration and exit cue."
    validation: "Compare playback with and without the silence. Confirm the intended cue or performance remains readable."
    related_rules: ["SND-004","SND-007","SND-008","SND-010","SND-012","DRA-014"]
    source_ids: ["SRC-CHEK-PLAY","SRC-THOM-SND","SRC-CHION-AV"]
    confidence: "medium"
  - rule_id: "SND-012"
    domain: "sound_design"
    name: "Manage dynamic range against the delivery target"
    type: "technical_constraint"
    priority: 1
    origin: "EBU R 128 measurement terms and Adobe dialogue practice."
    principle: "Treat integrated loudness, loudness range and true peak as different measurements. Use the destination's specified values and preserve purposeful dynamics within them."
    why_it_works: "Mix quality depends on intelligibility, contrast and adequate headroom as well as compliance with any delivery requirements."
    when_to_apply: "Final mixes, multiple platforms and loud scenes."
    when_to_break: "In the absence of a specified target, log your working target and test playback. Avoid importing an unrelated standard as a requirement."
    good_example: "Check the finished export's loudness and true peak, then listen to the quietest dialogue and loudest effects."
    common_mistake: "Checking peak alone and assuming that dialogue loudness or range is correct."
    ai_implementation: "Record destination spec or working target, meter, measured result and audibility checks. Re-measure after export."
    validation: "The export meets the relevant spec and carries intelligible speech and intended dynamics at ordinary listening levels."
    related_rules: ["SND-002","SND-004","SND-010","SND-011","SND-013"]
    source_ids: ["SRC-EBU-R128","SRC-ADOBE-ROOM"]
    confidence: "high"
  - rule_id: "SND-013"
    domain: "sound_design"
    name: "Assemble clip audio into a single scene mix"
    type: "creative_heuristic"
    priority: 1
    origin: "Rulebook integration of the sound categories, ambience and split editing."
    principle: "Keep the final audio plan on an editable timeline. Retain native clip audio only where it serves the scene, with separate tracks for dialogue, ambience, Foley/effects and music as useful."
    why_it_works: "Separate layers make continuity, synchronization and balance repairable when individual model outputs vary."
    when_to_apply: "Any scene made from more than one independent generation."
    when_to_break: "A cohesive single native take can supply a useful base. Save it separately and document what is embedded."
    good_example: "Use one room-tone bed, a selected clean line across coverage, and matched contact cues at cuts."
    common_mistake: "Importing each native track at full level so ambience, music or voices reset on every picture cut."
    ai_implementation: "Record audio ownership by cue, line source, room state, overlap handles and synchronization anchors. Plan replacement tracks before generating close dialogue."
    validation: "Listen through each join, compare intended perspective and review the full export in addition to solo tracks."
    related_rules: ["SND-002","SND-003","SND-004","SND-005","SND-007","SND-009","SND-012"]
    source_ids: ["SRC-ADOBE-ROOM","SRC-ADOBE-SFX","SRC-ADOBE-JL","SRC-THOM-SND"]
    confidence: "medium"
