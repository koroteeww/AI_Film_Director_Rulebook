schema_version: 2
domain: cinematography
rules:
  - rule_id: "CIN-CAM-001"
    domain: "cinematography"
    name: "Choose shot size by the information needed"
    type: "established_technique"
    priority: 1
    origin: "ACMI shot-size exercises and AFI shot rationale."
    principle: "Set the frame scale around the action, relationship or detail that must read."
    why_it_works: "A wide frame can show geography and body action. A close frame makes a small cue available and can feel intimate or intrusive in context."
    when_to_apply: "Shot-list planning."
    when_to_break: "Sustained distance can make the audience observe or infer. Check the necessary detail remains readable."
    good_example: "A wide keeps a door and performer together until a close shot makes a hesitation visible."
    common_mistake: "Choosing a close-up for an abstract emotion without checking what changes within the frame."
    ai_implementation: "Specify visible body boundaries and essential objects at start and end. Treat size as a composition target."
    validation: "At final display scale the audience can see all cues that justify the shot."
    related_rules: ["CIN-CAM-002","CIN-CAM-003","CIN-CAM-008","CIN-CAM-018","DIR-010"]
    source_ids: ["SRC-ACMI-SHOT","SRC-AFI-DIR"]
    confidence: "high"
  - rule_id: "CIN-CAM-002"
    domain: "cinematography"
    name: "Use angle and height to define relations"
    type: "established_technique"
    priority: 2
    origin: "ASC camera placement examples."
    principle: "Choose height, yaw, pitch and any roll by the relationship the viewer should perceive."
    why_it_works: "Height and angle change visibility, proportions and alignment. A low angle can increase apparent scale or align us with someone seated."
    when_to_apply: "Power shifts, subjective alignment and geographic clarity."
    when_to_break: "A deliberately neutral or fixed vantage can let behavior carry the shift."
    good_example: "A child's eye-level view hides what an adult sees over a countertop."
    common_mistake: "Using a low angle as a universal instruction for power."
    ai_implementation: "Describe camera height relative to the eyes, direction and visible surfaces. Add roll only when planned."
    validation: "Check viewpoint, horizon and surfaces against the floor plan and dramatic purpose."
    related_rules: ["CIN-CAM-001","CIN-CAM-005","CIN-CAM-010","DIR-002"]
    source_ids: ["SRC-ASC-POS","SRC-ACMI-SHOT"]
    confidence: "high"
  - rule_id: "CIN-CAM-003"
    domain: "cinematography"
    name: "Establish geography when it matters"
    type: "established_technique"
    priority: 1
    origin: "ACMI establishing shot and Smith's account of analytical editing."
    principle: "Show the relevant positions, routes and relationships before fragmenting them. Re-establish after a meaningful spatial change."
    why_it_works: "A viewer can assemble tighter shots around anchors already seen."
    when_to_apply: "New locations, group scenes, pursuit and changed blocking."
    when_to_break: "Delay orientation for surprise or subjective confusion and plan the moment of clarification."
    good_example: "Show both sides of the counter and the exit before cutting to hands below it."
    common_mistake: "Beginning with attractive scenery that never connects to the action space."
    ai_implementation: "List the anchors a wide, sound cue or motivated movement must establish. Add a new geography beat when the axis changes."
    validation: "A new viewer can sketch the locations that matter and track who can see or reach what."
    related_rules: ["CIN-CAM-004","CIN-CAM-005","CIN-CAM-009","CIN-CAM-018"]
    source_ids: ["SRC-ACMI-SHOT","SRC-SMITH-THESIS"]
    confidence: "high"
  - rule_id: "CIN-CAM-004"
    domain: "cinematography"
    name: "Track the action axis and screen direction"
    type: "continuity_convention"
    priority: 1
    origin: "Classical axis convention described by Smith."
    principle: "For a continuous exchange or motion, choose the dominant axis and default camera side. Preserve apparent direction across cuts."
    why_it_works: "Stable left-right relations help the viewer maintain orientation across independently framed views."
    when_to_apply: "Dialogues, pursuit, entrances, exits and handoffs."
    when_to_break: "Cross during a visible continuous move, after a clear re-establishment, or to create intentional disorientation. Check the result."
    good_example: "Two characters keep opposing screenward eyelines until an on-screen move establishes the new side."
    common_mistake: "Mirroring a reference image and reversing a prop hand or facing direction."
    ai_implementation: "Store axis anchors, camera side, screen entry and exit, and any axis-change method per shot."
    validation: "Draw both camera positions against the axis and compare the adjacent rendered frames."
    related_rules: ["CIN-CAM-003","CIN-CAM-005","CIN-CAM-006","CIN-CAM-007","CIN-CAM-014"]
    source_ids: ["SRC-SMITH-THESIS","SRC-SMITH-AT"]
    confidence: "high"
  - rule_id: "CIN-CAM-005"
    domain: "cinematography"
    name: "Match eyelines and reverse angles"
    type: "continuity_convention"
    priority: 1
    origin: "Smith on eyeline matching and shot/reverse-shot."
    principle: "Plan who looks at whom, gaze height and screenward direction across complementary angles. Use a shoulder when it clarifies the relation."
    why_it_works: "The look can connect an off-screen subject to a reverse or POV without showing both together."
    when_to_apply: "Dialogue, reactions, looks to objects and reveal setups."
    when_to_break: "An unmatched look may signal distraction, a lie or deliberately misleading alignment. Give that choice evidence."
    good_example: "A looks screen right toward taller B. B's reverse looks screen left and slightly down."
    common_mistake: "Giving both characters the same gaze direction in a single exchange."
    ai_implementation: "Specify gaze target by ID, offset from lens, height, camera side and visible shoulder if needed."
    validation: "Pause both shots and trace their lines of sight. They should meet the planned target in the shared map."
    related_rules: ["CIN-CAM-002","CIN-CAM-003","CIN-CAM-004","CIN-CAM-018","DIR-002"]
    source_ids: ["SRC-SMITH-THESIS","SRC-SMITH-AT"]
    confidence: "high"
  - rule_id: "CIN-CAM-006"
    domain: "cinematography"
    name: "Avoid accidental near-duplicate cuts"
    type: "continuity_convention"
    priority: 2
    origin: "The 30-degree rule described in Smith's thesis."
    principle: "For consecutive views of the same subject, change the angle or scale enough for the cut to read intentionally. About 30 degrees is a craft starting point for angular change."
    why_it_works: "A distinct view reduces the chance of a distracting jump when nearly identical framing changes suddenly."
    when_to_apply: "Analytical coverage and repair of near-matching shots."
    when_to_break: "A jump can express time loss, fracture or comedy. Keep a purposeful difference the viewer can register."
    good_example: "Cut from a three-quarter medium view to a distinctly tighter insert with new information."
    common_mistake: "Changing the position slightly and treating 30 degrees as a pass/fail law."
    ai_implementation: "Compare adjacency for angle, framing, subject pose and perceptual attention. Choose a cutaway or reframe when it bumps."
    validation: "Play the cut at speed. It should land as intended, whether smooth or deliberately abrupt."
    related_rules: ["CIN-CAM-004","CIN-CAM-007","CIN-CAM-018"]
    source_ids: ["SRC-SMITH-THESIS","SRC-SMITH-AT"]
    confidence: "high"
  - rule_id: "CIN-CAM-007"
    domain: "cinematography"
    name: "Match action across a cut"
    type: "continuity_convention"
    priority: 1
    origin: "Smith's attentional account of match-action and exits/entrances."
    principle: "Cut on compatible phases of a continuous action. Preserve the actor, hand, target, direction and object state."
    why_it_works: "The motion gives attention a thread through the change of viewpoint."
    when_to_apply: "Handoffs, entrances, sitting, opening and physical contact."
    when_to_break: "An ellipsis can omit part of the action when the new state and elapsed time are clear."
    good_example: "Cut during a reach and resume in the new angle before contact."
    common_mistake: "Showing a fully open door in the second frame while the first ends before the latch turns."
    ai_implementation: "Plan overlap handles and a shared action anchor. Describe both the pre-contact and post-contact state."
    validation: "Inspect two frames around the cut and play at speed. Check for a duplicated, skipped or reversed action."
    related_rules: ["CIN-CAM-004","CIN-CAM-005","CIN-CAM-006","CIN-CAM-013"]
    source_ids: ["SRC-SMITH-AT","SRC-SMITH-THESIS"]
    confidence: "high"
  - rule_id: "CIN-CAM-008"
    domain: "cinematography"
    name: "Compose a readable visual hierarchy"
    type: "established_technique"
    priority: 1
    origin: "ACMI framing exercises and Block's contrast and affinity."
    principle: "Use scale, tonal contrast, line, negative space, symmetry or asymmetry to prioritize what the viewer should notice."
    why_it_works: "Relative contrast and placement can guide attention or leave a deliberate absence legible."
    when_to_apply: "Boards, first frames and recrops."
    when_to_break: "Balanced distribution can invite scanning. Centering can express order, confrontation or stillness when the beat calls for it."
    good_example: "Leave open space in the direction of a look until a planned entrance fills it."
    common_mistake: "Applying a thirds grid to every shot regardless of the intended focus."
    ai_implementation: "Specify the first target, secondary target, planned empty area and composition constraints in the delivery aspect ratio."
    validation: "View the frame small. The intended emphasis survives crop, contrast and motion."
    related_rules: ["CIN-CAM-001","CIN-CAM-002","CIN-CAM-009","CIN-CAM-011","DIR-009"]
    source_ids: ["SRC-ACMI-COMP","SRC-BLOCK-VIS"]
    confidence: "high"
  - rule_id: "CIN-CAM-009"
    domain: "cinematography"
    name: "Stage depth with readable layers"
    type: "established_technique"
    priority: 2
    origin: "Block's visual structure and ASC placement practice."
    principle: "Use foreground, middle and background relationships, overlap, scale and motion to show depth or intentionally flatten it."
    why_it_works: "Depth can clarify geography, isolate a figure or let concurrent actions play within one frame."
    when_to_apply: "Staging reveals, ensemble shots and establishing geography."
    when_to_break: "A flat frontal composition can emphasize pattern, tableau or alienation."
    good_example: "A doorway frames a middle-ground exchange while a distant watcher remains readable."
    common_mistake: "Listing three layers without deciding which action each supports."
    ai_implementation: "Give each important layer an object ID, distance relation, focus state and occlusion rule."
    validation: "Compare start and end frames for preserved depth, intended occlusion and readable action."
    related_rules: ["CIN-CAM-003","CIN-CAM-008","CIN-CAM-010","CIN-CAM-011","CIN-CAM-014"]
    source_ids: ["SRC-BLOCK-VIS","SRC-ASC-POS","SRC-ACMI-COMP"]
    confidence: "high"
  - rule_id: "CIN-CAM-010"
    domain: "cinematography"
    name: "Set perspective with camera position"
    type: "technical_constraint"
    priority: 1
    origin: "Projective perspective and the Fujifilm camera-position comparison."
    principle: "Set viewpoint and subject distance first. For the same rectilinear viewpoint, focal length primarily changes field of view on a given sensor. Moving to maintain framing changes perspective."
    why_it_works: "Relative apparent scale, overlap and parallax follow camera placement. Lens distortion is a separate rendering effect."
    when_to_apply: "Lens selection, matching subject scale and dolly-versus-zoom decisions."
    when_to_break: "Use a fisheye or stylized projection deliberately. Specify the intended distortion in the visual bible."
    good_example: "A close wide view exaggerates near-far scale. A farther viewpoint with tighter framing makes near and far apparent sizes more similar."
    common_mistake: "Expecting an 85 mm label alone to create a consistent relationship between subject and background."
    ai_implementation: "Specify viewpoint, subject scale, field of view or full-frame equivalent, and relative background size. Treat numerical lens text as an intent cue in a generator."
    validation: "Check relative sizes and parallax against the plan. Confirm that matched framing has the intended perspective."
    related_rules: ["CIN-CAM-002","CIN-CAM-008","CIN-CAM-009","CIN-CAM-013","CIN-CAM-015"]
    source_ids: ["SRC-FUJI-PERS","SRC-ASC-DIST","SRC-ASC-POS"]
    confidence: "high"
  - rule_id: "CIN-CAM-011"
    domain: "cinematography"
    name: "Use focus depth and focus pulls to direct attention"
    type: "established_technique"
    priority: 2
    origin: "Nikon aperture basics and ACMI focus examples."
    principle: "Choose which distances are acceptably sharp and when the plane of focus should change."
    why_it_works: "Selective focus can isolate a subject. Deep focus lets the viewer compare simultaneous actions. A pull can shift emphasis without moving the camera."
    when_to_apply: "Close-ups, reveals and deep staging."
    when_to_break: "A soft or missed focus can express subjectivity. Make clear which fact must still read."
    good_example: "Hold the camera and transfer focus from a foreground object to the person beyond it on a sound cue."
    common_mistake: "Calling for both very shallow focus and two widely separated faces to remain sharp without a planned technique."
    ai_implementation: "Specify focus targets, relative depth, order and reveal trigger. Test shallow and deep versions if the model smears details."
    validation: "At the intended beat the target is sharp enough to read. Inspect focus transitions for texture drift."
    related_rules: ["CIN-CAM-008","CIN-CAM-009","CIN-CAM-010","CIN-CAM-012","CIN-CAM-017"]
    source_ids: ["SRC-NIK-AP","SRC-ACMI-COMP","SRC-ASC-CRAFT"]
    confidence: "high"
  - rule_id: "CIN-CAM-012"
    domain: "cinematography"
    name: "Pan and tilt around a fixed viewpoint"
    type: "established_technique"
    priority: 2
    origin: "ACMI camera-movement descriptions."
    principle: "Use a pan for horizontal rotation and a tilt for vertical rotation. Keep camera position fixed unless the shot explicitly adds translation."
    why_it_works: "Rotation can follow motion or reveal a new area while keeping the same spatial vantage."
    when_to_apply: "Tracking attention across a set or revealing height."
    when_to_break: "Combine rotation and translation when the changing perspective serves the beat. Name both paths."
    good_example: "From a locked tripod location pan from the empty doorway to the person who entered off-screen."
    common_mistake: "Calling a lateral move a pan when parallax is essential."
    ai_implementation: "Specify fixed position, start target, rotation direction, reveal trigger and final framing."
    validation: "Look for the intended reveal without a sliding camera or unexpected parallax."
    related_rules: ["CIN-CAM-009","CIN-CAM-013","CIN-CAM-014","CIN-CAM-017"]
    source_ids: ["SRC-ACMI-MOVE","SRC-ASC-POS"]
    confidence: "high"
  - rule_id: "CIN-CAM-013"
    domain: "cinematography"
    name: "Translate the camera with a dolly or track"
    type: "established_technique"
    priority: 2
    origin: "ACMI movement examples and camera-position optics."
    principle: "Use a push-in or pull-out to change distance, or a lateral track to change position alongside or across action."
    why_it_works: "Translation changes perspective and can uncover or hide space through parallax. A push can concentrate attention. A pull can restore context."
    when_to_apply: "Reveals, accompanying movement and a change of emotional distance."
    when_to_break: "A fixed view or optical zoom can preserve viewpoint when changing relative space is undesirable."
    good_example: "Track sideways past a foreground column to reveal a second person behind it."
    common_mistake: "Combining a constant subject scale with a forward move without a compensating lens or coordinated subject path."
    ai_implementation: "Specify path in scene space, speed, subject path, end framing and foreground parallax. Add a pause at the reveal if the edit needs it."
    validation: "Check foreground and background motion, occlusions and endpoint state."
    related_rules: ["CIN-CAM-009","CIN-CAM-010","CIN-CAM-012","CIN-CAM-014","CIN-CAM-015","CIN-CAM-017"]
    source_ids: ["SRC-ACMI-MOVE","SRC-FUJI-PERS"]
    confidence: "high"
  - rule_id: "CIN-CAM-014"
    domain: "cinematography"
    name: "Use a crane or orbit when changing viewpoint reveals space"
    type: "established_technique"
    priority: 2
    origin: "Camera-position mechanics and AFI shot rationale."
    principle: "A crane moves the viewpoint vertically or through an arc. An orbit moves around a target, typically with rotation to keep it framed."
    why_it_works: "A height change can disclose a route or relation. An orbit can expose new sides, change axis, or let the viewer discover the scene progressively."
    when_to_apply: "Spatial reveals and formal long takes."
    when_to_break: "Use a partial arc or a planned cut when geography or identity becomes unstable."
    good_example: "Rise above a partition far enough to reveal two people working on opposite sides."
    common_mistake: "Prompting a 360-degree orbit with incompatible background maps and unchanged screen directions."
    ai_implementation: "State origin, destination, radius or height change, target and stop. Track hidden sides, axis crossings and floor-level anchors."
    validation: "The move reveals the intended new information and preserves subject and object geometry."
    related_rules: ["CIN-CAM-003","CIN-CAM-004","CIN-CAM-009","CIN-CAM-013","CIN-CAM-017"]
    source_ids: ["SRC-ASC-POS","SRC-ACMI-MOVE","SRC-AFI-DIR"]
    confidence: "high"
  - rule_id: "CIN-CAM-015"
    domain: "cinematography"
    name: "Use zoom to change field of view from one position"
    type: "technical_constraint"
    priority: 2
    origin: "Focal length and position optics applied to ACMI zoom."
    principle: "For a zoom-only shot, keep the camera position fixed and change field of view. An ordinary zoom does not create the parallax of a dolly."
    why_it_works: "This isolates enlargement or widening as a formal emphasis. A crash zoom can make the camera's attention conspicuous."
    when_to_apply: "Fast reframing, observation from a fixed position and intentional style."
    when_to_break: "A coordinated dolly zoom deliberately changes distance and focal length to hold one subject scale while changing the background relation."
    good_example: "Zoom tightly to isolate an object at the end of a fixed-view shot."
    common_mistake: "Prompting a zoom and expecting the near wall to reveal hidden space through a change of viewpoint."
    ai_implementation: "Specify zoom in or out, fixed position, target scale and pace. Explicitly separate any required dolly move."
    validation: "Check subject enlargement and stable relative occlusion for a zoom-only shot."
    related_rules: ["CIN-CAM-010","CIN-CAM-012","CIN-CAM-013","CIN-CAM-017"]
    source_ids: ["SRC-ACMI-MOVE","SRC-FUJI-PERS","SRC-ACMI-COMP"]
    confidence: "high"
  - rule_id: "CIN-CAM-016"
    domain: "cinematography"
    name: "Choose locked or handheld behavior deliberately"
    type: "established_technique"
    priority: 2
    origin: "ACMI movement teaching and AFI's shot rationale."
    principle: "A locked frame can let the action and environment define rhythm. Controlled handheld motion can give bodily presence, urgency or observation."
    why_it_works: "The stability of the viewpoint changes where movement comes from and how the audience feels it."
    when_to_apply: "Performance-led shots and comparisons of subjective distance."
    when_to_break: "Handheld can be gentle and locked-off can be tense. Choose by the scene's effect."
    good_example: "Hold a still frame while small movements become conspicuous. Try restrained handheld when the viewpoint should feel physically present."
    common_mistake: "Using random shake as a shortcut to urgency."
    ai_implementation: "Specify stable horizon and no drift, or controlled movement with amplitude and target framing."
    validation: "Watch at normal speed and check that camera motion never hides the key action or violates the continuity plan."
    related_rules: ["CIN-CAM-008","CIN-CAM-012","CIN-CAM-013","CIN-CAM-017","DIR-010"]
    source_ids: ["SRC-ACMI-MOVE","SRC-AFI-DIR","SRC-TARK-ESSAY"]
    confidence: "high"
  - rule_id: "CIN-CAM-017"
    domain: "cinematography"
    name: "Time movement to a beat and protect the endpoint"
    type: "creative_heuristic"
    priority: 1
    origin: "AFI rationale for moves and cuts, adapted to generation planning."
    principle: "Give a move a dramatic trigger, a pace, an endpoint and enough usable hold or action overlap to edit."
    why_it_works: "A timed reveal or reframing helps the intended beat land. Editorial handles leave room to join clips."
    when_to_apply: "Any moving shot or planned camera shift in a generated clip."
    when_to_break: "Sustained continuous movement can define the whole scene. Locate its change of emphasis and any recovery point."
    good_example: "Begin a slow push only after a listener registers a sound, then settle in time to read the response."
    common_mistake: "Listing several simultaneous camera moves and expecting timestamps to control every frame."
    ai_implementation: "Describe start composition, ordered motion, terminal composition and estimated usable duration. Check exact provider timing separately."
    validation: "Scrub start, trigger and end, then verify the intended emphasis and cut in the assembled timeline."
    related_rules: ["CIN-CAM-011","CIN-CAM-012","CIN-CAM-013","CIN-CAM-014","CIN-CAM-015","CIN-CAM-016","DIR-010"]
    source_ids: ["SRC-AFI-DIR","SRC-ACMI-MOVE"]
    confidence: "medium"
  - rule_id: "CIN-CAM-018"
    domain: "cinematography"
    name: "Use inserts and cutaways to serve the cut"
    type: "established_technique"
    priority: 2
    origin: "Analytical editing and shot-size practice, adapted to AI coverage."
    principle: "An insert isolates relevant detail. A cutaway shifts attention to a related person, object or space outside the immediate action view."
    why_it_works: "Detail can clarify a cause or hide a join. A cutaway can redirect knowledge or make an elided action understandable."
    when_to_apply: "Props, reactions, reveals and continuity repair."
    when_to_break: "Hold on the action when the viewer should witness it uninterrupted."
    good_example: "Use a view of a changed indicator to establish the result of an off-screen manipulation."
    common_mistake: "Inserting an attractive detail that promises a role the story never gives it."
    ai_implementation: "Mark the detail's narrative function, prop state, orientation and audio relationship to neighboring shots."
    validation: "Play the sequence without the insert. Keep it if it supplies necessary information, attention or editorial flexibility."
    related_rules: ["CIN-CAM-001","CIN-CAM-003","CIN-CAM-005","CIN-CAM-006","CIN-CAM-007","DRA-008"]
    source_ids: ["SRC-ACMI-SHOT","SRC-SMITH-AT","SRC-AFI-DIR"]
    confidence: "high"
