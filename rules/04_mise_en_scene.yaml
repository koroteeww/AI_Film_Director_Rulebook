schema_version: 2
domain: mise_en_scene
rules:
  - rule_id: "MIS-001"
    domain: "mise_en_scene"
    name: "Map the playable space"
    type: "established_technique"
    priority: 1
    origin: "HSE staging practice and AFI concept modeling."
    principle: "Draw entrances, exits, anchors, obstacles and visibility before positioning cameras or performers."
    why_it_works: "A shared map makes routes, sightlines and actions consistent across separately generated angles."
    when_to_apply: "Repeated locations and interactions that depend on geography."
    when_to_break: "An abstract space can have flexible geometry. Identify the relations the story still depends on."
    good_example: "Put the witness, a door and an opaque screen on one plan so every view agrees about who can see the action."
    common_mistake: "Redesigning the room independently for each shot."
    ai_implementation: "Give spatial anchors stable IDs, one orientation, relative dimensions and occlusion rules. Preserve them in every scene reference."
    validation: "Trace every route, look and camera from the same map."
    related_rules: ["MIS-004","MIS-005","MIS-010","MIS-012","CIN-CAM-003"]
    source_ids: ["SRC-HSE-STAGE","SRC-AFI-DES"]
    confidence: "high"
  - rule_id: "MIS-002"
    domain: "mise_en_scene"
    name: "Use interpersonal distance as action"
    type: "established_technique"
    priority: 2
    origin: "Proxemics and scene staging as interpreted in the rulebook."
    principle: "Change distance, angle of approach, access or boundary crossing when it reveals the relationship."
    why_it_works: "Relative space can communicate intimacy, caution, avoidance, solidarity or status through action."
    when_to_apply: "Negotiations, reunions and shifts of power."
    when_to_break: "Cultural context and the characters' established behavior can reverse a reading. Use a baseline for this film."
    good_example: "One person closes the gap until a second places a bag between them."
    common_mistake: "Assigning universal meanings to fixed distances without considering context."
    ai_implementation: "Record distance trend, orientation, obstacle, trigger and who initiates or resists the move."
    validation: "The relation before and after the move is readable even with dialogue muted."
    related_rules: ["MIS-001","MIS-003","MIS-004","MIS-011","DIR-003"]
    source_ids: ["SRC-HALL-SPACE","SRC-OSU-MISE","SRC-BORD-CROSS"]
    confidence: "medium"
  - rule_id: "MIS-003"
    domain: "mise_en_scene"
    name: "Place power in the staging"
    type: "established_technique"
    priority: 2
    origin: "Bordwell on blocking and Ken Adam's design account."
    principle: "Express power through access to the center, height, exits, barriers, seating, group attention or control of an object."
    why_it_works: "The audience can read who controls a situation and observe a change without an explanatory line."
    when_to_apply: "Hierarchy, exclusion and reversals."
    when_to_break: "Subvert a familiar image of authority through the response of the others or an ironic relation between set and behavior."
    good_example: "A visitor stands at the far end of a table until the seated group turns to hear them."
    common_mistake: "Treating centrality or height as proof of authority in every scene."
    ai_implementation: "Specify who controls access and which spatial change externalizes the turn. Design a clear before and after frame."
    validation: "Check what the group does when power changes and whether the image makes that behavior legible."
    related_rules: ["MIS-002","MIS-004","MIS-006","MIS-010","DIR-013"]
    source_ids: ["SRC-BORD-CROSS","SRC-BFI-ADAM","SRC-HSE-STAGE"]
    confidence: "medium"
  - rule_id: "MIS-004"
    domain: "mise_en_scene"
    name: "Orient the body and gaze to a target"
    type: "established_technique"
    priority: 1
    origin: "Bordwell's blocking analysis and actor-oriented performance work."
    principle: "Set torso, head, gaze, hands and feet in relation to the action and the other performers."
    why_it_works: "Alignment can show attention, concealment, readiness or withdrawal. It also keeps reverse shots coherent."
    when_to_apply: "Dialogue, physical tasks and reference frames."
    when_to_break: "A mismatch can be the intended signal, such as a body preparing to leave while the gaze stays with a speaker."
    good_example: "A character faces the door with one foot while maintaining eye contact at the table."
    common_mistake: "Asking the character to face the door and look straight into the lens without a consistent pose."
    ai_implementation: "Record orientation and gaze targets by ID. Use separate constraints for head and torso where useful."
    validation: "Check hands, gaze, feet and weight against the action and floor plan at both endpoints."
    related_rules: ["MIS-001","MIS-002","MIS-005","MIS-011","MIS-012","CIN-CAM-005"]
    source_ids: ["SRC-BORD-CROSS","SRC-WEST-TOOLS","SRC-SMITH-THESIS"]
    confidence: "high"
  - rule_id: "MIS-005"
    domain: "mise_en_scene"
    name: "Stage entrances and exits with consequences"
    type: "continuity_convention"
    priority: 1
    origin: "Smith's discussion of entrances and exits, applied to staging."
    principle: "Define the boundary, movement vector, on-screen time, and state before entering and after leaving."
    why_it_works: "The viewer can infer route, timing and relations across a cut."
    when_to_apply: "Arrival, departure, pursuit and unseen movement."
    when_to_break: "A sudden entrance can be a surprise. Reconcile the path or preserve ambiguity as intended."
    good_example: "A person crosses behind an opaque screen and emerges at the mapped opening with the same object."
    common_mistake: "An actor exits screen right and immediately reappears in a location the planned route cannot reach."
    ai_implementation: "Specify entry or exit point, screen direction, route and who witnesses it. Anchor the geometry in a wider frame if needed."
    validation: "Trace the motion across cuts and check what other figures plausibly notice."
    related_rules: ["MIS-001","MIS-004","MIS-010","MIS-012","CIN-CAM-004","CIN-CAM-007"]
    source_ids: ["SRC-SMITH-AT","SRC-BORD-CROSS"]
    confidence: "high"
  - rule_id: "MIS-006"
    domain: "mise_en_scene"
    name: "Use design to express the world and the situation"
    type: "established_technique"
    priority: 2
    origin: "AFI visual development and Adam's account of set design."
    principle: "Choose a small number of spatial features, materials and signs of use that express the location's function and pressures."
    why_it_works: "The environment can establish a history, routine or power relationship through visible evidence."
    when_to_apply: "New locations and production design for frame generation."
    when_to_break: "Sparse or expressionist design can carry the intention through scale, shape or emptiness."
    good_example: "A carefully repaired surface beside an unused ceremonial seat suggests where daily work happens."
    common_mistake: "Adding generically luxurious or ruined detail that the scene has no use for."
    ai_implementation: "Create a location record with fixed anchors, materials, wear, controlled variation and one sentence on dramatic use."
    validation: "A viewer can infer the space's use from its visible features. Compare geometry and key materials across angles."
    related_rules: ["MIS-001","MIS-003","MIS-007","MIS-008","MIS-009"]
    source_ids: ["SRC-AFI-DES","SRC-OSU-MISE","SRC-BFI-ADAM"]
    confidence: "high"
  - rule_id: "MIS-007"
    domain: "mise_en_scene"
    name: "Treat props as stateful action objects"
    type: "creative_heuristic"
    priority: 1
    origin: "Chekhov on emphasis and film design practice, extended into continuity tracking."
    principle: "Identify the props that change action or reveal information. Track holder, location, orientation, use and changed state."
    why_it_works: "A prop can motivate behavior and make a consequence visible. A state ledger prevents accidental appearance or reset."
    when_to_apply: "Handoffs, reveals, inserts and repeated use."
    when_to_break: "Decorative set dressing can stay descriptive when it carries no action or cue."
    good_example: "Record a document as folded, carried by A, then open in B's hand after the exchange."
    common_mistake: "Creating the post-handoff state early or switching the carrying hand across cuts."
    ai_implementation: "Use stable prop IDs with before and after states, ownership and authorized changes by beat."
    validation: "Every important state transition has an observable cause or intentional ellipsis."
    related_rules: ["MIS-005","MIS-006","MIS-009","MIS-012","DRA-008","CIN-CAM-007"]
    source_ids: ["SRC-CHEK-GUN","SRC-OSU-MISE","SRC-AFI-DES"]
    confidence: "high"
  - rule_id: "MIS-008"
    domain: "mise_en_scene"
    name: "Keep costumes legible and continuous"
    type: "established_technique"
    priority: 2
    origin: "Film studies on costume and AFI visual-development practice."
    principle: "Specify silhouette, materials, palette, layers, accessories, wear and changes that reveal function or character."
    why_it_works: "A stable costume supports identity. A meaningful change can express action, status or time."
    when_to_apply: "Character references, continuity and scenes with costume changes."
    when_to_break: "A disguise, transformation or stylized jump can shift design. Identify what the audience should still recognize."
    good_example: "Keep a fixed jacket silhouette while wetness increases after a mapped event."
    common_mistake: "Using only a color adjective, then accepting changing collars, closures and accessories."
    ai_implementation: "Give each look a version and state changes. Use a clean reference from multiple useful angles for important details."
    validation: "Compare garment silhouette, texture, closure, accessories and damage or wetness to the reference."
    related_rules: ["MIS-006","MIS-007","MIS-011","MIS-012"]
    source_ids: ["SRC-OSU-MISE","SRC-AFI-DES","SRC-GIKIT-PLAN"]
    confidence: "high"
  - rule_id: "MIS-009"
    domain: "mise_en_scene"
    name: "Make environmental motion interact with action"
    type: "established_technique"
    priority: 2
    origin: "Hitchcock on the possibilities of the setting and BFI on Kurosawa's weather."
    principle: "Give important wind, rain, machinery or background activity a direction, cause and consequence."
    why_it_works: "Environment can reveal a condition, change tactics or establish how the character inhabits the space."
    when_to_apply: "Weather, props, movement in depth and environmental storytelling."
    when_to_break: "Atmospheric movement may serve rhythm or tone even without altering the plot. Keep it subordinate to the beat."
    good_example: "Wind moves a loose curtain and briefly reveals a figure in the doorway."
    common_mistake: "Generating incompatible wind direction or background activity that upstages the decisive action."
    ai_implementation: "Specify environmental motion separately from subject and camera motion. Add an interaction and its state change if relevant."
    validation: "Inspect direction and continuity across shots and check that the intended reveal remains legible."
    related_rules: ["MIS-006","MIS-007","MIS-010","MIS-012","DIR-011"]
    source_ids: ["SRC-HITCH-AFI","SRC-KURO-WEATH","SRC-HSE-STAGE"]
    confidence: "high"
  - rule_id: "MIS-010"
    domain: "mise_en_scene"
    name: "Use masking and depth to reveal in time"
    type: "established_technique"
    priority: 2
    origin: "Bordwell's analysis of actor crossings and staging in depth."
    principle: "Use bodies, walls, props or focus to control what is hidden, when it becomes visible, and whose reaction can be read."
    why_it_works: "Moving occlusion can reorganize attention within one view without requiring a cut."
    when_to_apply: "Group scenes, surprises and long takes."
    when_to_break: "Keep simultaneous cues visible when the viewer should compare them. Use contrast or timing to manage competition."
    good_example: "An actor's step clears a view of a listener just as the listener turns away."
    common_mistake: "Allowing a foreground figure to block the only sign of a decisive event."
    ai_implementation: "Mark layer, occluder, camera and subject paths, reveal beat and visibility before and after."
    validation: "Scrub the planned reveal and confirm that all earlier occlusions are intentional."
    related_rules: ["MIS-001","MIS-003","MIS-005","MIS-009","CIN-CAM-009","DIR-009"]
    source_ids: ["SRC-BORD-CROSS","SRC-OSU-MISE","SRC-HSE-STAGE"]
    confidence: "high"
  - rule_id: "MIS-011"
    domain: "mise_en_scene"
    name: "Give movement a playable purpose"
    type: "established_technique"
    priority: 1
    origin: "Stanislavski's action, Weston's process tools and the HSE workshop."
    principle: "Choose the smallest clearly readable body action that pursues the intention or responds to a change."
    why_it_works: "A viewer can read a tactic, relationship or hesitation through behavior. Restrained action can preserve timing and geometry in a clip."
    when_to_apply: "Blocking, silent action and camera-facing performance."
    when_to_break: "Choreographed or decorative movement can become the form itself. Design its rhythm and hierarchy."
    good_example: "The performer starts to stand, hears the response and settles back while retaining the object."
    common_mistake: "Adding fidgeting, gestures and wandering with no relation to the objective."
    ai_implementation: "Specify target, movement trigger, path and terminal pose. Let background figures hold or react in order."
    validation: "With the scene muted, distinguish meaningful motion from ambient motion and check the terminal pose."
    related_rules: ["MIS-002","MIS-004","MIS-008","MIS-012","DIR-003","DIR-006"]
    source_ids: ["SRC-STAN-ACT","SRC-WEST-TOOLS","SRC-HSE-STAGE"]
    confidence: "high"
  - rule_id: "MIS-012"
    domain: "mise_en_scene"
    name: "Carry scene state through the visual bible"
    type: "creative_heuristic"
    priority: 1
    origin: "Production-design planning, continuity editing, and rulebook adaptation."
    principle: "Freeze the stable attributes of a scene and describe only authorized changes in each shot. Keep a reference for entry and exit state."
    why_it_works: "A shared versioned reference gives image generation and editorial review the same anchors."
    when_to_apply: "Any sequence assembled from separate generations."
    when_to_break: "An intended discontinuity needs a distinct branch or version and a cue that helps viewers read the change."
    good_example: "A reverse angle references the same set map, costume version and post-handoff prop state as the preceding view."
    common_mistake: "Respecifying the whole environment with new wording for every shot."
    ai_implementation: "Keep an immutable reference block plus a per-beat delta. Store camera and actor state separately and keep source frame IDs."
    validation: "Compare the expected and observed state at each join. Reject unintended changes that affect identity, geography or causal action."
    related_rules: ["MIS-001","MIS-004","MIS-005","MIS-007","MIS-008","MIS-009","CIN-CAM-004"]
    source_ids: ["SRC-AFI-DES","SRC-HSE-STAGE","SRC-SMITH-AT"]
    confidence: "medium"
