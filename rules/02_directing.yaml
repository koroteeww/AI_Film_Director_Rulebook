schema_version: 2
domain: directing
rules:
  - rule_id: "DIR-001"
    domain: "directing"
    name: "Name the intended viewer experience"
    type: "creative_heuristic"
    priority: 1
    origin: "AFI Director's Craft and NFTS script interpretation."
    principle: "For each scene, name what the viewer should notice, understand and feel by the exit. Separate this intention from the character's goal."
    why_it_works: "One purpose can coordinate performance, staging, camera, sound and the cut."
    when_to_apply: "Before boards and whenever a scene has conflicting notes."
    when_to_break: "A scene may deliberately sustain ambiguity. State which facts stay legible and what interpretations remain open."
    good_example: "A calm introduction should become uneasy when the guest recognizes a detail."
    common_mistake: "Using a mood adjective as the whole directing brief."
    ai_implementation: "Record the intended viewer change, evidence beat, and craft choices serving it."
    validation: "Each major shot or cue can name a contribution. Remove or revise choices with conflicting purposes."
    related_rules: ["DIR-002","DIR-005","DIR-010","DRA-005"]
    source_ids: ["SRC-AFI-DIR","SRC-NFTS-DIR"]
    confidence: "high"
  - rule_id: "DIR-002"
    domain: "directing"
    name: "Choose narrative access and camera viewpoint"
    type: "established_technique"
    priority: 1
    origin: "Bordwell on access to story information and AFI on narrative point of view."
    principle: "Choose whose experience anchors a beat, what the viewer knows, and when camera or sound aligns with that perspective."
    why_it_works: "A controlled viewpoint guides knowledge and emotional alignment even without a literal eye view."
    when_to_apply: "Reveals, contested information and changes of alignment."
    when_to_break: "Switch viewpoints for irony, contrast or an intentional rupture. Give the viewer a cue at the switch."
    good_example: "Stay with a speaker until a listener hears a significant off-screen sound, then shift auditory attention."
    common_mistake: "Making a literal POV shot for every moment of subjective experience."
    ai_implementation: "For each beat store focal character, visible and audible access, optical viewpoint, and change cue."
    validation: "Recount what the viewer and focal character know after the beat. Check for accidental spoilers."
    related_rules: ["DIR-001","DIR-007","DIR-009","DRA-010"]
    source_ids: ["SRC-BORD-BOMB","SRC-AFI-DIR"]
    confidence: "high"
  - rule_id: "DIR-003"
    domain: "directing"
    name: "Direct with a playable action"
    type: "established_technique"
    priority: 1
    origin: "Stanislavski's action work and Weston's process-oriented tools."
    principle: "Give the performer a verb aimed at a target and a reason to try it now."
    why_it_works: "The actor or generation planner has a behavior to pursue and can react if it fails."
    when_to_apply: "When the brief names a state such as sad, angry or mysterious."
    when_to_break: "A stylized tableau can use poses as intentional graphic signs. Name the intended image and duration."
    good_example: "Ask the performer to reassure a witness while avoiding the witness's question."
    common_mistake: "Stacking adjectives without an objective or counterpart."
    ai_implementation: "Translate an intention into a target, visible tactic and response. Carry one action priority into the clip prompt."
    validation: "A viewer can describe something the performer tries to do and where their attention is directed."
    related_rules: ["DIR-004","DIR-005","DIR-006","DRA-003"]
    source_ids: ["SRC-STAN-ACT","SRC-WEST-TOOLS"]
    confidence: "high"
  - rule_id: "DIR-004"
    domain: "directing"
    name: "Use given circumstances"
    type: "established_technique"
    priority: 2
    origin: "Stanislavski's предлагаемые обстоятельства, adapted to a performance brief."
    principle: "Identify facts of place, relationship, preceding event and immediate constraints that affect this action."
    why_it_works: "The same words and gesture play differently under different conditions."
    when_to_apply: "Actor notes, scene interpretation and continuity across separately generated shots."
    when_to_break: "An intentionally abstract performance may omit literal history. Preserve the conditions that actually shape it."
    good_example: "A speaker keeps her voice low because the person she is discussing is behind a thin door."
    common_mistake: "Writing a complete biography when one relevant fact would change the performance."
    ai_implementation: "Keep a short circumstances list and convert each relevant item into a visible or audible consequence."
    validation: "Every circumstance carried into the prompt changes a choice, motion, position or sound."
    related_rules: ["DIR-003","DIR-006","DIR-008"]
    source_ids: ["SRC-STAN-ACT","SRC-WEST-TOOLS"]
    confidence: "high"
  - rule_id: "DIR-005"
    domain: "directing"
    name: "Find beats through changed tactics"
    type: "established_technique"
    priority: 1
    origin: "Weston on emotional events and McKee on scene changes."
    principle: "Mark a new beat when the character changes tactic, registers information or shifts the relationship."
    why_it_works: "Performance has legible turning points the camera and edit can support."
    when_to_apply: "Dialogue, physical tasks and rehearsals with several intentions."
    when_to_break: "Hold across a subtle turn when the audience benefits from discovering it within a sustained take."
    good_example: "A joke becomes a request after it draws no response."
    common_mistake: "Marking a cut at every line regardless of what the relationship does."
    ai_implementation: "Write action, trigger, reaction and exit state. Group consecutive beats into one generation only if the planned action stays feasible."
    validation: "Identify the first observable sign of each turn in the board or animatic."
    related_rules: ["DIR-001","DIR-003","DIR-007","DIR-012","DRA-005"]
    source_ids: ["SRC-WEST-TOOLS","SRC-MCK-TURN","SRC-AFI-DIR"]
    confidence: "high"
  - rule_id: "DIR-006"
    domain: "directing"
    name: "Convert performance notes into observable behavior"
    type: "creative_heuristic"
    priority: 1
    origin: "Rulebook translation of Weston's physical-life and action tools."
    principle: "Keep the inner intention in direction notes and choose a few visible or audible cues for the shot."
    why_it_works: "Concrete movement, gaze, breath or stillness can be reviewed across takes."
    when_to_apply: "Image and motion prompts and independent generation of adjacent shots."
    when_to_break: "A mask or long shot may require a larger body action. Use the minimum amplitude the framing can convey."
    good_example: "A hand begins reaching, stops short, and stays still while attention shifts to the listener."
    common_mistake: "Requesting several facial, hand and camera events in the same instant."
    ai_implementation: "Separate actor intent, observable cue, timing order and end state. Pick the strongest cue when the shot is crowded."
    validation: "Check in context at intended size and speed. The cue should be legible and leave the next shot in a compatible state."
    related_rules: ["DIR-003","DIR-004","DIR-008","DIR-010"]
    source_ids: ["SRC-WEST-TOOLS","SRC-AFI-DIR"]
    confidence: "medium"
  - rule_id: "DIR-007"
    domain: "directing"
    name: "Direct the listening and reaction"
    type: "established_technique"
    priority: 2
    origin: "Weston's relationship-based approach and Chekhov's use of pauses."
    principle: "Plan when a listener receives a cue, how they register it and whether the viewer sees that response."
    why_it_works: "A scene's meaning can change in the recipient while the speaker continues."
    when_to_apply: "Negotiations, withholding, persuasion and off-screen speech."
    when_to_break: "Hold on the speaker if their risk or loss of certainty is the key experience. Use sound or a later reaction to clarify."
    good_example: "Let an answer continue off-screen as the listener lowers an object they were about to hand over."
    common_mistake: "Cutting mechanically to the person who speaks each line."
    ai_implementation: "Add a reaction owner, trigger, delay, action, and optional cut candidate. Preserve listening state across shots."
    validation: "Watch without dialogue or listen without picture, then check whether the intended relationship turn survives the full cut."
    related_rules: ["DIR-002","DIR-005","DIR-012","DRA-012","DRA-014"]
    source_ids: ["SRC-WEST-TOOLS","SRC-CHEK-PLAY"]
    confidence: "high"
  - rule_id: "DIR-008"
    domain: "directing"
    name: "Rehearse the physical impulse"
    type: "established_technique"
    priority: 3
    origin: "Michael Chekhov's psychological gesture, with a film planning adaptation."
    principle: "Explore a larger physical gesture that expresses the character's drive, then decide what trace belongs in the performance."
    why_it_works: "A whole-body impulse can give a subtle gesture coherent direction."
    when_to_apply: "Stylized performances and scenes where internal conflict needs a physical expression."
    when_to_break: "Use straightforward task action when a formal exercise would distract or when the gesture is meant to stay overt."
    good_example: "Explore gathering something toward the chest, then express that impulse through a small change in the grip."
    common_mistake: "Putting a large rehearsal exercise on screen when the close framing calls for restraint."
    ai_implementation: "Keep the exercise in prep and specify the visible trace, its timing, and intensity in the shot."
    validation: "The result reads as motivated physical behavior and fits the framing and the scene's tone."
    related_rules: ["DIR-003","DIR-004","DIR-006"]
    source_ids: ["SRC-MCHEK-TECH","SRC-WEST-TOOLS"]
    confidence: "medium"
  - rule_id: "DIR-009"
    domain: "directing"
    name: "Block action to guide attention"
    type: "established_technique"
    priority: 1
    origin: "AFI cinematic storytelling and NYU staging practice."
    principle: "Use position, orientation, depth, contrast and timed movement to control when a viewer notices each important action."
    why_it_works: "The audience can find the action within a frame and understand who can see what."
    when_to_apply: "Group scenes, entrances and reveals in a single shot."
    when_to_break: "Give the viewer several simultaneous choices when wandering attention is part of the effect. Keep necessary facts recoverable."
    good_example: "A quiet background figure steps into an unobstructed pool of light only after the foreground action stops."
    common_mistake: "Animating every person and every prop through the decisive gesture."
    ai_implementation: "Mark the attention target at each beat, movement cue, relative depth and planned occlusion."
    validation: "A viewer can point to the intended subject at the key moment without needing a verbal explanation."
    related_rules: ["DIR-001","DIR-002","DIR-010","DIR-011"]
    source_ids: ["SRC-AFI-DIR","SRC-NYU-GRAD","SRC-BLOCK-VIS"]
    confidence: "high"
  - rule_id: "DIR-010"
    domain: "directing"
    name: "Give the camera and cut a reason"
    type: "established_technique"
    priority: 1
    origin: "AFI Director's Craft and Bordwell's account of narrative access."
    principle: "Tie shot size, movement, camera placement and the cut to a dramatic purpose such as reveal, reaction, clarity or duration."
    why_it_works: "Camera emphasis can strengthen a beat or draw attention away from it."
    when_to_apply: "Shot-list review and motion prompt design."
    when_to_break: "A formal move may set rhythm, establish a pattern or make the camera felt. State the planned effect."
    good_example: "A camera shift reveals who heard the exchange once that knowledge matters."
    common_mistake: "Adding a smooth orbit merely because the tool supports movement."
    ai_implementation: "Record the purpose, start target, movement trigger, final target and the option of holding the frame."
    validation: "Compare the shot to a locked version. Keep the move when it adds the intended information, relation or experience."
    related_rules: ["DIR-001","DIR-002","DIR-006","DIR-009","DIR-014"]
    source_ids: ["SRC-AFI-DIR","SRC-BORD-BOMB"]
    confidence: "high"
  - rule_id: "DIR-011"
    domain: "directing"
    name: "Make the setting act on the scene"
    type: "established_technique"
    priority: 2
    origin: "Hitchcock's AFI setting example and BFI analysis of Kurosawa's weather."
    principle: "Choose a feature of the location, prop or environment that alters an action or the viewer's reading of it."
    why_it_works: "The scene becomes specific to its world and can reveal information through cause and effect."
    when_to_apply: "Location-led scenes, obstacles, reveals and action design."
    when_to_break: "A stripped set can express abstraction. Treat absence of detail as part of the design."
    good_example: "A gust interrupts a handoff and forces a character to reveal which paper matters."
    common_mistake: "Adding atmospheric weather that changes between shots without a dramatic or physical reason."
    ai_implementation: "Link the environmental cue to an action and store its direction, state and continuity requirement."
    validation: "Explain what would change if the setting feature disappeared. Check that it persists across relevant shots."
    related_rules: ["DIR-004","DIR-009","DIR-013","DRA-011"]
    source_ids: ["SRC-HITCH-AFI","SRC-KURO-WEATH"]
    confidence: "high"
  - rule_id: "DIR-012"
    domain: "directing"
    name: "Shape tension and release through duration"
    type: "creative_heuristic"
    priority: 2
    origin: "Tarkovsky on filmed time and Weston's moment-by-moment process."
    principle: "Choose where the scene should tighten, hold or release. Let action, listening, silence or sustained observation create the duration."
    why_it_works: "Duration changes how much anticipation and reflection a viewer can experience."
    when_to_apply: "Tense exchanges, waiting, reactions and edits that feel hurried."
    when_to_break: "A hard cut can deny release or create shock when that is the stated intention."
    good_example: "Hold a listener long enough to see a decision form, then cut after their response begins."
    common_mistake: "Assigning a fast or slow tempo to every shot from a genre label."
    ai_implementation: "Write pressure change and the cue that justifies each hold or cut. Test alternatives in the animatic."
    validation: "Time the beat in context and compare an earlier and later cut. Choose by the intended experience."
    related_rules: ["DIR-005","DIR-007","DIR-014","DRA-014","DRA-017"]
    source_ids: ["SRC-TARK-ESSAY","SRC-WEST-TOOLS","SRC-AFI-DIR"]
    confidence: "medium"
  - rule_id: "DIR-013"
    domain: "directing"
    name: "Use contrast to express a turn"
    type: "established_technique"
    priority: 2
    origin: "Block's visual contrast and AFI's integration of image with story."
    principle: "Change one or more perceptible relations across a beat, such as distance, movement, tonal value or density, when it serves the intention."
    why_it_works: "A perceptible contrast makes a change in the situation easier to feel or recognize."
    when_to_apply: "Turns, shifts of power and transitions between emotional states."
    when_to_break: "Continuity or stillness can make a hidden change more troubling. Find evidence in behavior or sound."
    good_example: "Two figures share an even two-shot until one withdraws and the empty space becomes conspicuous."
    common_mistake: "Changing camera, lighting and movement together without knowing which one expresses the shift."
    ai_implementation: "Specify the before/after contrast and which element carries it. Preserve unrelated scene anchors."
    validation: "A side-by-side comparison shows the intended change and preserves the necessary identity and geography."
    related_rules: ["DIR-001","DIR-009","DIR-010","DIR-012"]
    source_ids: ["SRC-BLOCK-VIS","SRC-AFI-DIR"]
    confidence: "high"
  - rule_id: "DIR-014"
    domain: "directing"
    name: "Rehearse transitions and minimum coverage"
    type: "creative_heuristic"
    priority: 1
    origin: "Lumet's rehearsal account, AFI exercises and NFTS expressive editing."
    principle: "Walk through the scene from entry state to exit, then plan the shots and transitions needed for the intended cut."
    why_it_works: "A rehearsal can find missing geography, reaction, action overlap or a sound bridge before expensive generation."
    when_to_apply: "Before motion production and when a one-take plan is brittle."
    when_to_break: "A long take can carry the full beat if performance and spatial action remain legible. Identify an edit recovery point if feasible."
    good_example: "Board the handoff, the receiver's reaction and an exit cue. Test a sound overlap into the next scene."
    common_mistake: "Generating every angle without a plan for where they would cut together."
    ai_implementation: "Mark exit-to-entry link, coverage purpose, overlaps, room tone and fallback. Favor a small reference test before full generation."
    validation: "Assemble the boards in order. Check the turn, axis, action match and audio bridge without relying on missing footage."
    related_rules: ["DIR-005","DIR-009","DIR-010","DIR-012","DRA-015"]
    source_ids: ["SRC-LUM-TALK","SRC-AFI-DIR","SRC-NFTS-DIR"]
    confidence: "high"
