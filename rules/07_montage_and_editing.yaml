schema_version: 2
domain: montage_and_editing
rules:
  - rule_id: "EDT-001"
    domain: "montage_and_editing"
    name: "Orient the viewer through the sequence"
    type: "continuity_convention"
    priority: 1
    origin: "Smith on continuity editing and attentional expectations."
    principle: "Keep the relevant action, direction, time and relationships legible across the sequence. Re-establish after a meaningful change."
    why_it_works: "The viewer can follow cause and response without reconstructing irrelevant geometry."
    when_to_apply: "Coverage assemblies, entrances, exits and moving axes."
    when_to_break: "A discontinuity can be expressive when the viewer understands the intended degree of confusion or rupture."
    good_example: "A moving character changes the line of action on screen, and the next reverse follows the re-established line."
    common_mistake: "Checking that individual frames look plausible without playing the cut."
    ai_implementation: "Compare screen direction, axes, object state and salient action across all neighboring shots."
    validation: "A first viewer can follow who did what, to whom, and when."
    related_rules: ["EDT-002","EDT-004","EDT-008","EDT-014","CIN-CAM-004","MIS-012"]
    source_ids: ["SRC-SMITH-AT","SRC-SMITH-THESIS","SRC-ACMI-EDIT"]
    confidence: "high"
  - rule_id: "EDT-002"
    domain: "montage_and_editing"
    name: "Choose the cut phase of a continuous action"
    type: "continuity_convention"
    priority: 1
    origin: "ACMI action cutting and Smith's attention account."
    principle: "Align motion phases and choose the cut point that makes the action read as one continuous event."
    why_it_works: "The incoming movement can carry attention and reduce a perceptual interruption."
    when_to_apply: "Two views of one movement and generation joins."
    when_to_break: "A repeated or skipped phase can emphasize an impact or express time loss. Make the repetition or gap deliberate."
    good_example: "Select two takes that share the moment before a hand contacts a latch, then trim into one opening."
    common_mistake: "Cutting between two identical endpoints so the gesture freezes or repeats."
    ai_implementation: "Set source in/out and timeline edit point using a named action anchor. Compare one earlier and later cut."
    validation: "Single-step for phase and state. Play at speed for the intended motion and sound."
    related_rules: ["EDT-001","EDT-003","EDT-004","EDT-009","CIN-CAM-007","SND-005"]
    source_ids: ["SRC-ACMI-EDIT","SRC-SMITH-AT"]
    confidence: "high"
  - rule_id: "EDT-003"
    domain: "montage_and_editing"
    name: "Rank emotion, story, and rhythm before cosmetic repair"
    type: "creative_heuristic"
    priority: 1
    origin: "Walter Murch's Rule of Six."
    principle: "Compare candidate cuts for emotional truth, story contribution, rhythm, eye trace, two-dimensional continuity and three-dimensional space. Resolve tradeoffs in that order when it fits the scene."
    why_it_works: "The best geometric match can still damage an important reaction. An intentional compromise can protect the central experience."
    when_to_apply: "When several edits satisfy different criteria or generation coverage is incomplete."
    when_to_break: "Geographic or temporal confusion can destroy the story. Treat required comprehension as part of the story criterion."
    good_example: "Keep a slightly awkward match if its reaction is essential and the viewer still follows the action."
    common_mistake: "Using the six weights as a universal film score or using emotion to excuse incoherence."
    ai_implementation: "Write which criteria each candidate serves and what is sacrificed. Check comprehension before keeping the compromise."
    validation: "Show both versions and ask which better carries the intended feeling and story information."
    related_rules: ["EDT-001","EDT-002","EDT-004","EDT-012","EDT-014","DIR-012"]
    source_ids: ["SRC-MURCH-SIX","SRC-SMITH-AT"]
    confidence: "high"
  - rule_id: "EDT-004"
    domain: "montage_and_editing"
    name: "Use rhythm and eye trace to manage attention"
    type: "established_technique"
    priority: 2
    origin: "Murch on rhythm and eye trace and Smith's attentional account."
    principle: "Decide where the audience is likely looking at the outgoing cut, where it should look next, and how long it needs to read the new event."
    why_it_works: "Aligning attention can ease a cut. Deliberately shifting it can create a jolt or discovery."
    when_to_apply: "Fast cutting, significant inserts, musical timing and contrast cuts."
    when_to_break: "A search for the new target can be the point. Leave time for that search."
    good_example: "Cut from the position of a hand to a new detail in a nearby screen region, then hold for the reaction."
    common_mistake: "Cutting every time on a music beat while the visual action remains unreadable."
    ai_implementation: "Mark focal screen zone, anticipated eye movement and reading time. Compare in context and at delivery size."
    validation: "The viewer finds the new action in time. The cut cadence supports the beat rather than obscuring it."
    related_rules: ["EDT-001","EDT-003","EDT-006","EDT-010","EDT-012","CIN-CAM-008"]
    source_ids: ["SRC-MURCH-SIX","SRC-SMITH-AT","SRC-BLOCK-VIS"]
    confidence: "high"
  - rule_id: "EDT-005"
    domain: "montage_and_editing"
    name: "Use adjacent shots to change an inference"
    type: "established_technique"
    priority: 1
    origin: "Kuleshov tradition and modern bounded replication."
    principle: "Pair a reaction, space or gesture with a context shot and test what new meaning the combination suggests."
    why_it_works: "Viewers may attribute emotion or causal relation partly from context."
    when_to_apply: "Neutral reactions, off-screen discoveries and ambiguous images."
    when_to_break: "A performance with strong specific information can overpower a context cue. Deliberate ambiguity can invite several readings."
    good_example: "Hold the same neutral reaction in two edit versions and change the preceding object to test the perceived emotion."
    common_mistake: "Assuming any neutral face will produce the same response in all viewers."
    ai_implementation: "Use the same reaction asset and vary only the context when testing. Record intended inference and alternate readings."
    validation: "Show a short A/B cut and ask viewers to name the emotion or event and the cue they used."
    related_rules: ["EDT-004","EDT-006","EDT-007","EDT-014","DIR-007"]
    source_ids: ["SRC-KUL-TEST","SRC-SMITH-AT","SRC-EIS-FORM"]
    confidence: "high"
  - rule_id: "EDT-006"
    domain: "montage_and_editing"
    name: "Specify the relation a montage creates"
    type: "established_technique"
    priority: 2
    origin: "Eisenstein's Methods of Montage and Pudovkin's discussion of contrast."
    principle: "Use shot duration, movement, dominant affect, interacting qualities or conceptual collision to build a planned relation across shots."
    why_it_works: "An edit sequence can create a comparison or idea the individual images do not express alone."
    when_to_apply: "Associative sequences, emotional pressure and graphic or intellectual contrast."
    when_to_break: "Continuity or a long hold can serve when the event must be witnessed in one spatial relation."
    good_example: "Cut between a repeated machine action and a repeated human action to invite comparison."
    common_mistake: "Calling a collection of unrelated attractive shots montage and relying on the audience to invent the intended relation."
    ai_implementation: "Choose the primary relation, shot pairs, motif and planned change. Try a different order and compare its implication."
    validation: "The viewer can articulate a plausible relation that serves the theme or event."
    related_rules: ["EDT-004","EDT-005","EDT-007","EDT-010","EDT-012","EDT-013"]
    source_ids: ["SRC-EIS-FORM","SRC-PUD-FILM","SRC-EIS-BFI"]
    confidence: "high"
  - rule_id: "EDT-007"
    domain: "montage_and_editing"
    name: "Build a sequence by contrast or constructive selection"
    type: "established_technique"
    priority: 2
    origin: "Pudovkin's own discussion and Cameron's analysis."
    principle: "Select details that let the viewer reconstruct an event or compare two actions. Give each shot an inferential role."
    why_it_works: "Reordering or contrasting selected views can clarify cause, build parallel meaning or strengthen an emotional relation."
    when_to_apply: "Analytical breakdown and association across separate locations."
    when_to_break: "Preserve a continuous take when the evidence or experience depends on witnessing the whole event."
    good_example: "Show a change in a mechanism and the resulting reaction in a nearby space, with a cue connecting the two."
    common_mistake: "Using a cutaway that implies the wrong event or timing."
    ai_implementation: "Label each shot as cause, evidence, reaction, contrast or consequence. Assemble a minimally sufficient sequence first."
    validation: "A reader can reconstruct the intended event or comparison without relying on an unshown decisive fact."
    related_rules: ["EDT-005","EDT-006","EDT-008","EDT-009","EDT-013","CIN-CAM-018"]
    source_ids: ["SRC-PUD-FILM","SRC-PUD-STUDY","SRC-ACMI-EDIT"]
    confidence: "high"
  - rule_id: "EDT-008"
    domain: "montage_and_editing"
    name: "Define the time relation in intercut strands"
    type: "established_technique"
    priority: 2
    origin: "Pudovkin's parallel and simultaneous examples, applied to editing."
    principle: "When alternating strands, specify whether they are simultaneous, causally ordered, or juxtaposed for a comparison. Build an anchor for the required reading."
    why_it_works: "The alternation can build anticipation or theme without accidentally implying that every event happens together."
    when_to_apply: "Cross-cut rescue or pursuit, parallel routines and different timelines."
    when_to_break: "Leave temporal relation ambiguous when the audience benefits from comparing actions without placing them on one clock."
    good_example: "Use a shared audible signal or event to indicate that two actions occur together."
    common_mistake: "Intercutting unrelated actions with a countdown and accidentally promising that they will meet."
    ai_implementation: "Track strand IDs, story order, concurrent cues and intended inference. Preserve separate location and audio state."
    validation: "Ask a viewer what is simultaneous and what is thematic. Confirm the answer fits the edit's intention."
    related_rules: ["EDT-001","EDT-005","EDT-006","EDT-007","EDT-009"]
    source_ids: ["SRC-PUD-FILM","SRC-PUD-STUDY"]
    confidence: "high"
  - rule_id: "EDT-009"
    domain: "montage_and_editing"
    name: "Use ellipsis to compress time"
    type: "established_technique"
    priority: 1
    origin: "ACMI's condensing-time lesson and Aristotle's plot unity."
    principle: "Omit intervals that viewers can reconstruct. Give the next shot a readable change of state or time marker."
    why_it_works: "The film keeps pace while preserving causality and emotional duration where it matters."
    when_to_apply: "Routine travel, repeated tasks and changes in time."
    when_to_break: "Show elapsed effort when duration, labor or waiting is the experience. A compressed version may lose the point."
    good_example: "Jump from an early stage of work to a changed state with a recognizable object and a time cue."
    common_mistake: "Removing the cause of a consequence and calling the gap economy."
    ai_implementation: "Mark skipped interval, preserved anchors, changed state and a cue. Test whether the viewer needs an intermediate beat."
    validation: "A first viewer understands the time jump, the causal relation and the consequence."
    related_rules: ["EDT-001","EDT-002","EDT-008","EDT-011","DRA-015"]
    source_ids: ["SRC-ACMI-EDIT","SRC-ARIS-POE"]
    confidence: "high"
  - rule_id: "EDT-010"
    domain: "montage_and_editing"
    name: "Use graphic or sonic matches with a reason"
    type: "established_technique"
    priority: 2
    origin: "Film education examples of graphic matching and sound-bridge practice."
    principle: "Match a visual feature, gesture, rhythm or sound across the cut when similarity or contrast should connect separate images."
    why_it_works: "A match can bridge time, place or idea, and can make a discontinuity readable as a designed transition."
    when_to_apply: "Motif returns, ellipsis and expressive transitions."
    when_to_break: "Break the match when difference or rupture carries more force."
    good_example: "The cut from the thrown bone to an object in orbit in 2001 uses a graphic relation across a large time gap."
    common_mistake: "Matching a color or shape so closely that viewers think a discontinuous location is the same space unintentionally."
    ai_implementation: "Record shared shape, screen position or sound timing and the intended change in time, space or meaning."
    validation: "The matching feature is perceptible at speed and the viewer can infer the intended transition."
    related_rules: ["EDT-004","EDT-006","EDT-008","EDT-009","EDT-014","SND-009"]
    source_ids: ["SRC-BPB-MATCH","SRC-ACMI-EDIT","SRC-ADOBE-JL"]
    confidence: "high"
  - rule_id: "EDT-011"
    domain: "montage_and_editing"
    name: "Make a jump cut deliberate"
    type: "established_technique"
    priority: 2
    origin: "ACMI's jump-cut lesson and BFI's Breathless example."
    principle: "Expose a discontinuity between similar views when a visible jump should express compression, fracture, humor or force."
    why_it_works: "The apparent skipping makes the edit itself part of the experience."
    when_to_apply: "Elliptical routines, disruptions and expressive rhythm."
    when_to_break: "Use more distinct coverage, a matched action, a cutaway or a hold when the jump distracts from the scene."
    good_example: "Keep the composition stable while repeated intervals skip forward to compress a task."
    common_mistake: "Retaining a tiny continuity error because a jump cut was possible in principle."
    ai_implementation: "Name the skipped interval and intended effect. Test a smoother alternative and record the chosen reason."
    validation: "The viewer experiences an intentional jolt and can follow the event to the degree required."
    related_rules: ["EDT-002","EDT-004","EDT-009","EDT-012","CIN-CAM-006"]
    source_ids: ["SRC-ACMI-EDIT","SRC-BFI-BREATH"]
    confidence: "high"
  - rule_id: "EDT-012"
    domain: "montage_and_editing"
    name: "Let time accumulate within the shot"
    type: "creative_heuristic"
    priority: 2
    origin: "Tarkovsky's observation and recorded time, in dialogue with Murch's timing concern."
    principle: "Try holding through a complete behavioral, spatial or sonic change. Cut when attention or experience benefits from the change of view."
    why_it_works: "A duration can give the viewer time to discover an event or inhabit a wait. Cutting quickly may remove that experience."
    when_to_apply: "Observation, suspense, waiting, performance and space."
    when_to_break: "Compress when the viewer already has what the hold can offer or when a cut creates the necessary relation."
    good_example: "Hold on an open doorway while a sound recedes and the viewer reinterprets the empty space."
    common_mistake: "Confusing a long generated file with a shot that earns its screen time."
    ai_implementation: "Test a held and edited version using the same dramatic cue. Log the usable generation window and fallback cut point."
    validation: "The duration sustains or transforms attention. Ask what would be lost if cut earlier."
    related_rules: ["EDT-003","EDT-004","EDT-006","EDT-011","EDT-013","DIR-012"]
    source_ids: ["SRC-TARK-ESSAY","SRC-TARK-TIME","SRC-MURCH-SIX"]
    confidence: "medium"
  - rule_id: "EDT-013"
    domain: "montage_and_editing"
    name: "Organize observed fragments into a viewpoint"
    type: "established_technique"
    priority: 3
    origin: "Vertov's Kino-Eye tradition and the BFI film account."
    principle: "Group observed actions, processes or textures around a pattern the sequence can reveal."
    why_it_works: "An arrangement can show relationships or rhythms without a conventional protagonist or explanation."
    when_to_apply: "Essayistic, documentary-style and experimental shorts."
    when_to_break: "If the short promises a causal story, preserve the chain of information and decisions along with the pattern."
    good_example: "Alternate repeated gestures across people and locations to make a shared routine visible."
    common_mistake: "Presenting synthetic footage as documentary evidence."
    ai_implementation: "Specify motif, image source, perspective, and the progression in what viewers can infer. Label generated or reconstructed assets in the provenance record."
    validation: "The sequence conveys a discoverable relation, and its source and presentation agree with the project's disclosure."
    related_rules: ["EDT-005","EDT-006","EDT-007","EDT-012","DRA-016"]
    source_ids: ["SRC-VERT-LEF","SRC-VERT-KINO","SRC-BFI-VERT"]
    confidence: "medium"
  - rule_id: "EDT-014"
    domain: "montage_and_editing"
    name: "Carry the emotional state into the next scene"
    type: "creative_heuristic"
    priority: 1
    origin: "Murch's emotion and story priorities plus split-edit practice."
    principle: "Design the last cue of one scene and the first cue of the next as one transition. Decide what carries over and what changes."
    why_it_works: "A shared emotion, sound or contrast helps the viewer connect scenes even when place or time shifts."
    when_to_apply: "Scene transitions, endings and tonal shifts."
    when_to_break: "An abrupt reset can be an intentional rupture. State what the audience should carry despite it."
    good_example: "Let a question hang over the next scene's first image before the next action answers it indirectly."
    common_mistake: "Using a transition effect that erases the reaction or suggests an unintended time relation."
    ai_implementation: "Record exit state, entry state, bridge or contrast, picture boundary and sound overlaps."
    validation: "Play the transition without notes and ask what emotion or information crosses the boundary."
    related_rules: ["EDT-001","EDT-003","EDT-005","EDT-008","EDT-010","SND-009","DRA-017"]
    source_ids: ["SRC-MURCH-SIX","SRC-ADOBE-JL","SRC-ACMI-EDIT"]
    confidence: "high"
