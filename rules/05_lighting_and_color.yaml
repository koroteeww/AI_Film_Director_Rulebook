schema_version: 2
domain: lighting_and_color
rules:
  - rule_id: "LGT-001"
    domain: "lighting_and_color"
    name: "Motivate the visible light"
    type: "established_technique"
    priority: 1
    origin: "ARRI source roles and ASC set-lighting practice."
    principle: "Start with a plausible source in the scene, or a clearly intended stylized lighting system. Specify how it illuminates surfaces and performers."
    why_it_works: "Consistent direction and quality make spatial relations and a change in light intelligible."
    when_to_apply: "New locations and cross-angle frame generation."
    when_to_break: "An expressionist change can break naturalism. Record its beat, effect and visual logic."
    good_example: "A side window supplies soft daylight from world east across both angles."
    common_mistake: "Recreating camera-left light in the reverse even though the window has changed screen side."
    ai_implementation: "Anchor source position and direction in world space. Derive screen effects after choosing camera position."
    validation: "Across cuts, trace shadow and highlight direction to the mapped source or documented stylization."
    related_rules: ["LGT-002","LGT-004","LGT-007","LGT-010","MIS-001"]
    source_ids: ["SRC-ARRI-LIGHT","SRC-ASC-BURUM","SRC-VGIK-CIN"]
    confidence: "high"
  - rule_id: "LGT-002"
    domain: "lighting_and_color"
    name: "Assign key, fill, and separation by function"
    type: "established_technique"
    priority: 1
    origin: "ARRI handbook and Burum's professional demonstration."
    principle: "Use key for the dominant modeling light, fill for shadow control, and back, edge or background light where separation is needed."
    why_it_works: "Independent functions help tune form, contrast and legibility. A single source and bounce can serve multiple functions."
    when_to_apply: "Portraits, dialogue and hard-to-read silhouettes."
    when_to_break: "A silhouette, flat wash or single-source effect may be the goal. Omit roles that would weaken it."
    good_example: "A window models the face. Wall bounce keeps eyes readable. A lighter wall separates the dark costume without a rim."
    common_mistake: "Assuming every subject needs three conspicuous sources."
    ai_implementation: "Describe each function in terms of source, relative level and visible effect. Allow one source to cover several roles."
    validation: "The viewer sees the intended planes, shadow detail and separation without distracting extra shadows."
    related_rules: ["LGT-001","LGT-003","LGT-005","LGT-010"]
    source_ids: ["SRC-ARRI-LIGHT","SRC-ASC-BURUM"]
    confidence: "high"
  - rule_id: "LGT-003"
    domain: "lighting_and_color"
    name: "Define the contrast ratio you mean"
    type: "technical_constraint"
    priority: 2
    origin: "Lighting role separation in ARRI and exposure arithmetic."
    principle: "Name what is being compared. A source key-to-fill ratio and a lit-to-shadow subject ratio describe different measurements. Two stops is a fourfold ratio in a linear exposure measure."
    why_it_works: "Explicit measurement avoids mismatched targets and false precision across views."
    when_to_apply: "Contrast specifications, on-set references, and exposure matching."
    when_to_break: "For generated images without a calibrated workflow, state a qualitative target and use reference frames or scopes in a known space."
    good_example: "Record shadow-side reference exposure roughly two stops below the lit-side reference, with a consistent metering method."
    common_mistake: "Giving a 4:1 number without defining what was measured or deriving it from display-code values directly."
    ai_implementation: "Use relative shadow depth and sample areas. Store measured stops only where the measurement method and color pipeline are known."
    validation: "Compare the selected reference areas under equivalent conditions and ensure important texture remains readable."
    related_rules: ["LGT-002","LGT-006","LGT-010","LGT-012"]
    source_ids: ["SRC-ARRI-LIGHT","SRC-ASC-BURUM","SRC-BMD-MATCH"]
    confidence: "high"
  - rule_id: "LGT-004"
    domain: "lighting_and_color"
    name: "Coordinate practicals with off-camera support"
    type: "established_technique"
    priority: 2
    origin: "ARRI background-light and source guidance plus ASC examples."
    principle: "Record visible practical fixtures and their apparent effect, then add plausible off-camera support if required for the frame."
    why_it_works: "A visible lamp can motivate color and direction while controlled support protects faces and background detail."
    when_to_apply: "Interiors, night exteriors and scenes where a fixture changes state."
    when_to_break: "A practical may read as decor without contributing much light. Leave it subdued if its output is irrelevant."
    good_example: "A warm desk lamp glows in frame and a soft nearby source extends its direction across the face."
    common_mistake: "Brightening the lamp but leaving the adjacent table completely unaffected in a realistic shot."
    ai_implementation: "Set fixture position, on/off state, color, bloom and affected surfaces. Store the supported direction and side."
    validation: "Check fixture and spill consistency and whether a switched state changes the planned surfaces."
    related_rules: ["LGT-001","LGT-002","LGT-007","LGT-010","LGT-011","MIS-007"]
    source_ids: ["SRC-ARRI-LIGHT","SRC-ASC-BURUM"]
    confidence: "high"
  - rule_id: "LGT-005"
    domain: "lighting_and_color"
    name: "Control hard and soft light by apparent source size"
    type: "technical_constraint"
    priority: 1
    origin: "ASC Light Quality 101 and ARRI hard/soft examples."
    principle: "With the subject and shadow-receiving surface geometry held fixed, a larger apparent source produces a wider shadow-edge transition. A small apparent source produces sharper shadows."
    why_it_works: "Shadow-edge quality changes texture, form and the feel of a space independently of brightness."
    when_to_apply: "Specifying sun, diffuse sky, windows, bounce and fabric texture."
    when_to_break: "Mixed hard and soft components can be intentional. Give each a separate source and effect."
    good_example: "A broad nearby window gives a gradual cheek shadow, while direct sun marks a harder window shape."
    common_mistake: "Equating dim light with soft light or requesting a large close source with uniformly razor-sharp penumbrae."
    ai_implementation: "Describe apparent source size, distance relationship, shadow edge and affected surface. Keep quality distinct from level."
    validation: "Inspect transition width and direction on a stable surface and the subject across frames."
    related_rules: ["LGT-001","LGT-002","LGT-003","LGT-006","LGT-011"]
    source_ids: ["SRC-ASC-QUALITY","SRC-ARRI-LIGHT"]
    confidence: "high"
  - rule_id: "LGT-006"
    domain: "lighting_and_color"
    name: "Use high-key and low-key as tonal designs"
    type: "established_technique"
    priority: 2
    origin: "ARRI lighting functions and the Alton reading path."
    principle: "For a high-key treatment keep most important areas luminous and manage contrast. For low-key design reserve substantial darkness and selective areas of light."
    why_it_works: "Tonal distribution steers attention and sets the scene's visual texture. Mood follows context."
    when_to_apply: "Choosing a scene's tonal organization."
    when_to_break: "A bright image can have strong contrast and a dark image can be flat. Describe the actual distribution when labels are ambiguous."
    good_example: "A low-key hallway leaves walls dark while light makes the doorway and face readable."
    common_mistake: "Writing low-key as an instruction to underexpose every surface."
    ai_implementation: "Name dominant value ranges, shadow regions and protected readable details. Reference a hero frame."
    validation: "At delivery brightness the intended detail remains visible and the frame holds its intended tonal organization."
    related_rules: ["LGT-002","LGT-003","LGT-005","LGT-008","LGT-010"]
    source_ids: ["SRC-ARRI-LIGHT","SRC-ALTON-LIGHT","SRC-BLOCK-VIS"]
    confidence: "high"
  - rule_id: "LGT-007"
    domain: "lighting_and_color"
    name: "Separate source color from white balance"
    type: "technical_constraint"
    priority: 1
    origin: "ARRI notes on color, applied to shot continuity."
    principle: "Track the apparent colors of sources and the camera's neutral reference separately. Mixed sources may remain visibly different after one is neutralized."
    why_it_works: "A stable reference keeps planned warm and cool relationships consistent across angles."
    when_to_apply: "Mixing daylight, lamps, color effects or footage from different generations."
    when_to_break: "A deliberate white-balance shift can mark time, point of view or disorientation. Declare the change and anchor it to the story."
    good_example: "A room keeps a cool window and warmer fixture in the same relationship across coverage."
    common_mistake: "Neutralizing every source or treating Kelvin alone as a complete description of an LED spectrum."
    ai_implementation: "Store named source colors, white reference or intent, exposure state and expected visible surfaces. Use Kelvin as a cue if useful."
    validation: "Compare neutral reference objects and source relationships across adjacent shots."
    related_rules: ["LGT-001","LGT-004","LGT-008","LGT-010","LGT-012"]
    source_ids: ["SRC-ARRI-LIGHT","SRC-BMD-MATCH"]
    confidence: "high"
  - rule_id: "LGT-008"
    domain: "lighting_and_color"
    name: "Use palette contrast and affinity to organize attention"
    type: "established_technique"
    priority: 2
    origin: "Block's visual structure and AFI design work."
    principle: "Define a palette for the environment and wardrobe, then reserve selected hue, value or saturation differences for the intended attention target."
    why_it_works: "A consistent palette can bind space and character. A contrast can make a reveal or relation legible."
    when_to_apply: "Design, boards and framing before generation."
    when_to_break: "A crowded or discordant palette can express a world. Use position, focus or motion when necessary to preserve the important signal."
    good_example: "A muted room leaves a single saturated object legible when it becomes relevant."
    common_mistake: "Applying a generic cinematic color treatment that erases the character or prop's distinguishing cue."
    ai_implementation: "Record base palette, accent role, protected asset colors and what changes on specific beats."
    validation: "Compare the frame in color and grayscale. Verify the intended cue is carried by the planned channel."
    related_rules: ["LGT-006","LGT-007","LGT-009","LGT-010","CIN-CAM-008"]
    source_ids: ["SRC-BLOCK-VIS","SRC-AFI-DES"]
    confidence: "high"
  - rule_id: "LGT-009"
    domain: "lighting_and_color"
    name: "Use a color motif as a contextual promise"
    type: "creative_heuristic"
    priority: 2
    origin: "Block's contrast framework and a rulebook application of setup and payoff."
    principle: "Build color meaning through repetition, placement and change across the film. Give any shift a dramatic or perceptual job."
    why_it_works: "Meaning accumulates from the film's own pattern. Viewers can connect colors to a character, condition or evolving relation."
    when_to_apply: "Color arcs, motif returns and subjective transitions."
    when_to_break: "A film can stay within one palette and change texture, light direction or sound. Avoid a hue shift that conflicts with continuity."
    good_example: "A recurrent color moves from the environment to an object the character chooses to keep."
    common_mistake: "Assuming a color has the same emotional meaning in every story or culture."
    ai_implementation: "Store the motif, appearances, baseline associations, planned changes and a reference frame per look state."
    validation: "Review the arc in thumbnails and a rough cut. Identify what creates the intended reading beyond the hue label."
    related_rules: ["LGT-007","LGT-008","LGT-010","LGT-012","DRA-008"]
    source_ids: ["SRC-BLOCK-VIS","SRC-AFI-DES","SRC-CHEK-GUN"]
    confidence: "medium"
  - rule_id: "LGT-010"
    domain: "lighting_and_color"
    name: "Protect separation and exposure continuity"
    type: "continuity_convention"
    priority: 1
    origin: "ARRI separation and background light plus shot-matching practice."
    principle: "Keep important subject surfaces distinguishable from the background and preserve believable exposure relationships across views."
    why_it_works: "The viewer retains a stable reading of the subject and location. Designed changes can register distinctly."
    when_to_apply: "Reverse angles, repeated setups and mixed-source continuity."
    when_to_break: "A subject can disappear into the background for concealment or abstraction. Preserve the information the scene needs."
    good_example: "A rim or lighter wall separates a dark sleeve while the room's window direction stays consistent."
    common_mistake: "Solving every shot independently so shadows, skin values and room contrast jump across a cut."
    ai_implementation: "Choose a hero reference, match shadow side, relative face and background values and critical color patches. Store changes by beat."
    validation: "Compare adjacent frames with stills or appropriate scopes and play the cut at speed."
    related_rules: ["LGT-001","LGT-002","LGT-003","LGT-006","LGT-007","LGT-012"]
    source_ids: ["SRC-ARRI-LIGHT","SRC-BMD-MATCH","SRC-ASC-BURUM"]
    confidence: "high"
  - rule_id: "LGT-011"
    domain: "lighting_and_color"
    name: "Give atmospheric light spatial logic"
    type: "established_technique"
    priority: 2
    origin: "ASC lighting quality and BFI on expressive weather, adapted to generation."
    principle: "Place haze, dust, smoke or rain in the mapped space. Describe how sources, occluders and movement make the effect visible."
    why_it_works: "Atmosphere can reveal depth, alter visibility and give the scene a physical condition."
    when_to_apply: "Backlit rain, shafts, silhouettes, and air between planes."
    when_to_break: "Stylized light can act as a graphic form. State where it starts, stops and changes."
    good_example: "A shaft from a window becomes visible in light haze, with a beam interrupted by the person crossing it."
    common_mistake: "Adding bright beams in clean air with no plausible source or occlusion in a realistic shot."
    ai_implementation: "Specify density by layer, source path, beam visibility, airflow and the action it affects."
    validation: "Inspect volume placement, occlusion, motion direction and consistency between coverage angles."
    related_rules: ["LGT-001","LGT-004","LGT-005","LGT-010","MIS-009"]
    source_ids: ["SRC-ASC-QUALITY","SRC-KURO-WEATH","SRC-ARRI-LIGHT"]
    confidence: "medium"
  - rule_id: "LGT-012"
    domain: "lighting_and_color"
    name: "Match shots before applying the creative grade"
    type: "established_technique"
    priority: 1
    origin: "Blackmagic shot-matching training and the ACES concept of a look."
    principle: "Identify the footage's color interpretation, correct accidental exposure and balance differences, and compare to a hero shot before building a shared creative look."
    why_it_works: "Technical matching reduces cut-to-cut discrepancies. A look can then develop intent across scenes."
    when_to_apply: "Editing generated footage from different modes, providers, or lighting states."
    when_to_break: "Preserve deliberate differences tied to time, perspective or source changes. Document the discontinuity."
    good_example: "Align a costume patch and background tone in two matching angles before applying the scene's low-saturation look."
    common_mistake: "Applying an identical preset to mismatched clips and assuming they will match, or tagging an SDR clip as log."
    ai_implementation: "Log source space if known. Normalize only with verified transforms, match visible references, and then apply the look. Check export against timeline."
    validation: "Use stills or scopes in a consistent viewing pipeline. Compare near the cut and replay the exported file."
    related_rules: ["LGT-003","LGT-006","LGT-007","LGT-008","LGT-009","LGT-010"]
    source_ids: ["SRC-BMD-MATCH","SRC-ACES-LOOK","SRC-BLOCK-VIS"]
    confidence: "high"
