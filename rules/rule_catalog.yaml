schema_version: 1
priority:
  1: Core
  2: Situational
  3: Specialized
confidence_scale:
  high: Clear support for the narrowly scoped principle
  medium: Supported technique, with contextual effects or extrapolation
  provisional: Working inference requiring validation
rules:
  - rule_id: "DRA-001"
    domain: "dramaturgy"
    name: "Unify the action"
    type: "dramaturgical_principle"
    priority: 1
    origin: "Aristotle's account of plot unity, applied to the short form."
    principle: "Organize the film around one consequential action, relationship change or inquiry."
    why_it_works: "The viewer can infer how each beat bears on a recognizable whole."
    when_to_apply: "Narrative shorts and first-pass beat lists."
    when_to_break: "An episodic or associative film can unify through a question, motif or a transformation in the viewer's understanding."
    good_example: "The search for a misplaced object also tests whether its owner will accept help."
    common_mistake: "Including every event that happened to the protagonist that day."
    ai_implementation: "Write one controlling action or organizing experience. Tag the contribution of each scene to it."
    validation: "Remove one scene on paper. Keep it if a later cause, emotional interpretation or significant pattern changes."
    related_rules: ["DRA-006","DRA-015"]
    source_ids: ["SRC-ARIS-POE","SRC-NYU-GRAD"]
    confidence: "high"
  - rule_id: "DRA-002"
    domain: "dramaturgy"
    name: "Link decisions and consequences"
    type: "dramaturgical_principle"
    priority: 1
    origin: "Aristotle on probable or necessary sequence, with a short-film application."
    principle: "Give each major beat a cause and a consequence. Use plausibility within the film's established world."
    why_it_works: "An audience can connect decisions, obstacles and results across an ellipsis."
    when_to_apply: "Plot-driven stories and moments that change the available options."
    when_to_break: "Accident can initiate a story, or express the intended instability of its world. Make clear what it changes for the character."
    good_example: "In The Black Hole the device enables each increasingly risky choice and the final trap follows from that use."
    common_mistake: "Rescuing a blocked character with an ability introduced at the moment it is needed."
    ai_implementation: "Store a cause, action and visible effect for each turn. Flag leaps as deliberate ellipses, mysteries or gaps."
    validation: "A reader can connect the resolution to an earlier condition or choice without inventing a new event."
    related_rules: ["DRA-001","DRA-007","DRA-009"]
    source_ids: ["SRC-ARIS-POE","SRC-FILTA-BLACK"]
    confidence: "high"
  - rule_id: "DRA-003"
    domain: "dramaturgy"
    name: "Separate goal, motive, and need"
    type: "dramaturgical_principle"
    priority: 1
    origin: "Truby's distinction between desire and need, with Egri's emphasis on behavior."
    principle: "Give the character a concrete pursuit, a reason to pursue it and, if the premise calls for one, a deeper need."
    why_it_works: "The goal organizes action. The motive gives it weight. A gap between goal and need can create an arc."
    when_to_apply: "Character-led narratives and revision of passive scenes."
    when_to_break: "An observational short may follow a recurring behavior or attention shift. A stable character can test another person's assumptions."
    good_example: "A brother wants a signed form today to avoid losing a place. His refusal to ask for help may reveal a separate need."
    common_mistake: "Using one abstract label such as freedom for every field."
    ai_implementation: "Write goal as a verb with a target and success condition. State motive and optional need separately. Attach observable evidence to each."
    validation: "Someone can identify success or failure from a planned action and explain why it matters to this person."
    related_rules: ["DRA-004","DRA-005","DRA-016"]
    source_ids: ["SRC-TRUB-TALK","SRC-EGRI-ART","SRC-PIX-PIPER"]
    confidence: "high"
  - rule_id: "DRA-004"
    domain: "dramaturgy"
    name: "Escalate cost or resistance"
    type: "dramaturgical_principle"
    priority: 1
    origin: "Egri on conflict arising from character and Truby on opponents."
    principle: "Make the pursuit meet resistance and change the cost, options, information or tactic as the story proceeds."
    why_it_works: "The audience can distinguish a meaningful escalation from repeated action."
    when_to_apply: "Goal-led scenes, comedy, conflict and suspense."
    when_to_break: "Repetition can build ritual, dread or comedy when a meaningful detail changes or the repetition itself becomes the subject."
    good_example: "The waves in Piper make the food-seeking goal difficult through a readable feature of the location."
    common_mistake: "Adding more obstacles of the same kind while the character behaves the same way."
    ai_implementation: "Give each attempt an obstacle and a changed state. Track the consequence of failure in concrete terms."
    validation: "Explain how the second attempt puts a different option or cost in play."
    related_rules: ["DRA-002","DRA-003","DRA-006"]
    source_ids: ["SRC-EGRI-ART","SRC-TRUB-TALK","SRC-PIX-PIPER"]
    confidence: "high"
  - rule_id: "DRA-005"
    domain: "dramaturgy"
    name: "Turn the scene"
    type: "dramaturgical_principle"
    priority: 1
    origin: "McKee's scene-value exercise, broadened for observational and tonal work."
    principle: "Give a scene an objective and a discernible change in knowledge, leverage, relation, options or feeling."
    why_it_works: "The audience gets a reason to remember the scene and a different situation for the next beat."
    when_to_apply: "Dramatic scene breakdown and edits that feel static."
    when_to_break: "A deliberate hold may establish a baseline, place or rhythm. Name what the duration or accumulation contributes."
    good_example: "A request begins as a favor and becomes a test of loyalty when the cost is disclosed."
    common_mistake: "A busy scene repeats information the audience already knows."
    ai_implementation: "Record entry state, immediate objective, pivot and exit state. Mark whether a character or only the audience registers it."
    validation: "Read the entry and exit states aloud. If the distinction is hard to name, check the scene's purpose or combine it."
    related_rules: ["DRA-003","DRA-006","DRA-015"]
    source_ids: ["SRC-MCK-TURN","SRC-AFI-DIR"]
    confidence: "high"
  - rule_id: "DRA-006"
    domain: "dramaturgy"
    name: "Track one dramatic question"
    type: "creative_heuristic"
    priority: 2
    origin: "Landau's discussion of anticipation, adapted to short-film planning."
    principle: "Give the viewer something specific to wonder about and update the answer as circumstances change."
    why_it_works: "A question can carry interest through quiet passages, action or limited exposition."
    when_to_apply: "Loglines, openings and narrative scene order."
    when_to_break: "An essay film can orient attention with a tension or motif that invites reflection without a yes-or-no answer."
    good_example: "Will the seller accept the exchange after she recognizes the buyer?"
    common_mistake: "Asking vague rhetorical questions without a way to infer an answer."
    ai_implementation: "Store a main question plus the beat that raises it, later changes it and resolves or deliberately leaves it open."
    validation: "A fresh reader can state what the film made them anticipate and what the ending did with it."
    related_rules: ["DRA-001","DRA-005","DRA-010","DRA-017"]
    source_ids: ["SRC-LAND-TALK","SRC-BORD-BOMB"]
    confidence: "medium"
  - rule_id: "DRA-007"
    domain: "dramaturgy"
    name: "Earn the character arc"
    type: "dramaturgical_principle"
    priority: 2
    origin: "Truby on weakness and need and Aristotle on recognition, with an optional stable arc."
    principle: "Let a significant choice reveal change, failure to change, or a principle tested under new pressure."
    why_it_works: "An observable decision under pressure gives the viewer evidence of a changed relationship, belief or priority."
    when_to_apply: "Stories promising transformation or revelation."
    when_to_break: "A stable protagonist can change the setting, another person, or the audience's interpretation. State whose state shifts."
    good_example: "A reluctant collaborator volunteers the last remaining resource after earlier guarding it."
    common_mistake: "Announcing growth in final dialogue while the behavior remains ambiguous for accidental reasons."
    ai_implementation: "Pair an early choice with a later choice under comparable or greater cost. State the before and after inference."
    validation: "A viewer can point to behavior that supports the claimed change or resolve."
    related_rules: ["DRA-002","DRA-003","DRA-005","DRA-017"]
    source_ids: ["SRC-TRUB-TALK","SRC-ARIS-POE"]
    confidence: "medium"
  - rule_id: "DRA-008"
    domain: "dramaturgy"
    name: "Pay off what the film emphasizes"
    type: "dramaturgical_principle"
    priority: 1
    origin: "Anton Chekhov's advice on a monologue that creates a promise, applied to screen emphasis."
    principle: "If framing, repetition, sound or dialogue presents a detail as consequential, plan how it will matter or how the expectation will be deliberately redirected."
    why_it_works: "Audiences track prominent details and use their return to infer coherence or reinterpretation."
    when_to_apply: "Distinctive props, stated abilities, rules of the world and explicit promises."
    when_to_break: "A detail can pay off through atmosphere, thematic echo, character or an intentional redirection. Background texture can simply establish the world."
    good_example: "A latch shown to stick returns when a character needs to leave quietly."
    common_mistake: "Giving a decorative prop an emphatic insert and forgetting the implication."
    ai_implementation: "Keep a ledger of setup beat, attention cue, expected meaning, later function and carry-over prop state."
    validation: "Every strongly emphasized setup has a later function or an explicit reason to stay open."
    related_rules: ["DRA-002","DRA-009","DRA-015"]
    source_ids: ["SRC-CHEK-GUN","SRC-CHEK-CHR","SRC-CHEK-PLAY"]
    confidence: "high"
  - rule_id: "DRA-009"
    domain: "dramaturgy"
    name: "Plant a fair reversal"
    type: "dramaturgical_principle"
    priority: 2
    origin: "Aristotle on reversal and recognition, with Chekhov's treatment of expectation."
    principle: "Prepare a turn with evidence the audience can reinterpret once it has the missing information."
    why_it_works: "A turn can be unexpected on first viewing and legible on reflection."
    when_to_apply: "Reveals, mysteries, comic reversals and discoveries."
    when_to_break: "Absurdism can use an unprepared break as the intended event. Clarify that the effect is rupture."
    good_example: "A repeated look at an exit initially reads as fear, then gains a different meaning when the character uses it to help someone."
    common_mistake: "Withholding a basic fact that all shots would ordinarily reveal, then calling the reveal a twist."
    ai_implementation: "Track cue, first plausible reading, later reading and action that changes because of the reveal."
    validation: "A fresh viewer can identify a real earlier cue after the reveal and explain its changed meaning."
    related_rules: ["DRA-002","DRA-008","DRA-010"]
    source_ids: ["SRC-ARIS-POE","SRC-CHEK-GUN"]
    confidence: "high"
  - rule_id: "DRA-010"
    domain: "dramaturgy"
    name: "Control what the viewer knows"
    type: "established_technique"
    priority: 2
    origin: "Hitchcock's illustration and Bordwell's analysis of narration, extended to a beat ledger."
    principle: "Choose which story facts the viewer and each key character have at each beat. Decide how long to sustain any gap."
    why_it_works: "An information gap can create dramatic irony or anticipatory suspense. Shared uncertainty can create tension from a character's immediate experience."
    when_to_apply: "Suspense, surprise, deception, mystery and relationship scenes."
    when_to_break: "An omniscient narrator or chorus can make information shared and keep interest through consequence, rhythm or tone."
    good_example: "A viewer sees a character discard the only key before the other person confidently promises to open the door."
    common_mistake: "Revealing danger after the scene and expecting tension before the reveal."
    ai_implementation: "Record viewer knowledge, focal character knowledge, source shot or line, and the intended effect of showing or withholding the fact."
    validation: "For each reveal, specify who first knows it and what changes if it is moved earlier."
    related_rules: ["DRA-006","DRA-009","DRA-012"]
    source_ids: ["SRC-BORD-BOMB","SRC-LAND-TALK"]
    confidence: "high"
  - rule_id: "DRA-011"
    domain: "dramaturgy"
    name: "Put exposition inside action"
    type: "established_technique"
    priority: 1
    origin: "Hitchcock's AFI master class and NYU's visual exercise."
    principle: "Give essential information through behavior, an object being used, environmental reaction, a sound cue or a line spoken to achieve something."
    why_it_works: "The viewer learns the world while something consequential is happening."
    when_to_apply: "Openings, visual storytelling and exposition-heavy scenes."
    when_to_break: "Speech, voice-over or a title may be the right dramatic form when the act of telling is meaningful or the fact needs clarity."
    good_example: "A character calmly replaces the same worn fuse by touch, showing a practiced relationship to the place."
    common_mistake: "Stopping the story for a line that explains the action already on screen."
    ai_implementation: "Assign each necessary fact a carrier, recipient, and moment. Use a low-cost still or sound when a new generated shot adds little."
    validation: "Mute or remove the explanatory line. Check whether essential information survives or restore the part that does useful work."
    related_rules: ["DRA-005","DRA-012","DRA-013","DRA-015"]
    source_ids: ["SRC-HITCH-AFI","SRC-NYU-GRAD"]
    confidence: "high"
  - rule_id: "DRA-012"
    domain: "dramaturgy"
    name: "Write playable subtext"
    type: "established_technique"
    priority: 2
    origin: "A close reading of Anton Chekhov's play, combined with actor-oriented scene work."
    principle: "Give the character a reason to avoid saying something directly. Let the line and the action reveal enough for an inference."
    why_it_works: "The viewer can feel the pressure between the surface tactic and the underlying aim."
    when_to_apply: "Scenes of negotiation, intimacy, concealment or social restraint."
    when_to_break: "A direct declaration can work when honesty is difficult and saying it changes the situation."
    good_example: "In Act IV of The Cherry Orchard, the talk of travel and ordinary details carries the failure to say something consequential."
    common_mistake: "Withholding all observable clues and expecting an abstract emotion to read."
    ai_implementation: "Record literal line, playable intent, barrier and visible cue. Keep the hidden aim in direction notes and express the cue in the performance prompt."
    validation: "A reader can propose the intended subtext and cite a line, gesture or pause that supports it."
    related_rules: ["DRA-003","DRA-005","DRA-010","DRA-013","DRA-014"]
    source_ids: ["SRC-CHEK-PLAY","SRC-AFI-DIR"]
    confidence: "medium"
  - rule_id: "DRA-013"
    domain: "dramaturgy"
    name: "Give dialogue a dramatic job"
    type: "creative_heuristic"
    priority: 2
    origin: "Hitchcock on action-bearing exposition and the NYU sync-sound exercise, adapted to script revision."
    principle: "Keep dialogue that pursues, conceals, changes, specifies or gives a character an unmistakable voice."
    why_it_works: "Purposeful lines develop a relationship or carry information the rest of the scene cannot convey as precisely."
    when_to_apply: "Script and timing passes, especially in dialogue-heavy shorts."
    when_to_break: "Repetition, banter or a monologue can serve performance, comic rhythm, social pressure or the act of telling."
    good_example: "One character repeats a polite invitation after being refused, turning the phrase into pressure."
    common_mistake: "Adding a line that paraphrases a clear action or tells the other character facts they both know."
    ai_implementation: "Tag the work of each line. Read it aloud at the intended performance pace and move essential information to a clearer carrier if needed."
    validation: "Try removing or shortening the line. Compare voice, intent, legibility and timing before deciding."
    related_rules: ["DRA-011","DRA-012","DRA-014","DRA-015"]
    source_ids: ["SRC-HITCH-AFI","SRC-NYU-GRAD","SRC-CHEK-PLAY"]
    confidence: "medium"
  - rule_id: "DRA-014"
    domain: "dramaturgy"
    name: "Write silence as an active beat"
    type: "established_technique"
    priority: 2
    origin: "The silence and recurring off-screen sound in The Cherry Orchard, applied to film."
    principle: "Specify what happens in a pause, what the audience can hear and what ends the silence."
    why_it_works: "A pause creates room to process a change, hear an environment or experience a character's decision."
    when_to_apply: "After a refusal, before a choice, or when an action and a sound cue carry a transition."
    when_to_break: "A deliberately numb or abstract interval may have little visible movement. Use duration and sound consciously."
    good_example: "After an unanswered request, a hand holds on the door frame while footsteps recede."
    common_mistake: "Inserting a pause as a fixed number of seconds without a performance or sound purpose."
    ai_implementation: "Specify silence type, observable action, room tone or off-screen cue and the event that ends the hold."
    validation: "The hold changes attention or meaning in a timed rehearsal. Compare a shorter version if it stalls."
    related_rules: ["DRA-005","DRA-012","DRA-013","DRA-017"]
    source_ids: ["SRC-CHEK-PLAY","SRC-NYU-GRAD"]
    confidence: "medium"
  - rule_id: "DRA-015"
    domain: "dramaturgy"
    name: "Compress between consequential beats"
    type: "creative_heuristic"
    priority: 1
    origin: "Aristotle's unity test and NYU's limited-scope projects, adapted to short production."
    principle: "Spend runtime on actions that change the story or how the audience experiences it. Let viewers infer routine connective action when the link is clear."
    why_it_works: "Selective omission gives meaningful action and reaction enough screen time."
    when_to_apply: "Runtime pressure, travel, repeated explanations and low-value coverage."
    when_to_break: "A journey, ritual or wait can be the emotional center. Preserve enough duration to feel its effect."
    good_example: "Cut from a refusal to a changed arrival when place and elapsed time are apparent."
    common_mistake: "Removing the reaction that makes a fast plot beat emotionally intelligible."
    ai_implementation: "Tag beats by dramatic, sensory or orienting function. Merge duplicate functions and allocate seconds to meaningful action and recovery."
    validation: "A timed read or animatic fits with space to understand the critical turn. Test every omitted link for ambiguity."
    related_rules: ["DRA-001","DRA-005","DRA-011","DRA-016"]
    source_ids: ["SRC-ARIS-POE","SRC-NYU-GRAD","SRC-MCK-TURN"]
    confidence: "high"
  - rule_id: "DRA-016"
    domain: "dramaturgy"
    name: "Choose structure to fit the intention"
    type: "creative_heuristic"
    priority: 2
    origin: "Field, Campbell, Vogler, Landau and rulebook synthesis for shorts."
    principle: "Use a structure when it clarifies the intended action or emotion. Compare one alternative if the first structure adds obligations the premise does not need."
    why_it_works: "Different forms organize attention through consequence, repetition, discovery, encounter or contrast."
    when_to_apply: "Outline development and stalled revisions."
    when_to_break: "A requested form or genre constraint can set the pattern. Keep the parts that make that pattern legible."
    good_example: "A repeated encounter is organized around changes in behavior. It can use a loop with variation even if it has no quest."
    common_mistake: "Scaling a feature-film page formula to seconds and creating scenes solely to meet it."
    ai_implementation: "Choose a structural lens and record the jobs of the beats. Keep one rejected alternative and why it fit less well."
    validation: "Read the beats without their structural labels. The viewer should still follow the planned experience."
    related_rules: ["DRA-001","DRA-006","DRA-007","DRA-015"]
    source_ids: ["SRC-FIELD-CASE","SRC-CAMP-HERO","SRC-VOGL-TALK","SRC-LAND-TALK"]
    confidence: "high"
  - rule_id: "DRA-017"
    domain: "dramaturgy"
    name: "Land the consequence and the afterbeat"
    type: "dramaturgical_principle"
    priority: 1
    origin: "Aristotle on completeness and a close reading of the final sound cues in The Cherry Orchard."
    principle: "Show the outcome of the governing action, or make the intended uncertainty perceptible. Give the viewer time to experience the consequence."
    why_it_works: "An ending can resolve action while leaving an emotional, ethical or thematic question active."
    when_to_apply: "Climax and final scene design."
    when_to_break: "An abrupt cut can make unresolved tension the intended last sensation. Establish what remains open before the cut."
    good_example: "A door closes after the decision. A short off-screen sound changes how the audience reads the empty room."
    common_mistake: "Adding a speech that repeats the conclusion after the audience has already understood the consequence."
    ai_implementation: "Record final choice, consequence, last image or sound, and the question that remains open if any. Allocate a short edit handle separately from the story runtime."
    validation: "After a read or animatic, ask what happened, what is still uncertain, and what the last beat made the viewer feel."
    related_rules: ["DRA-002","DRA-006","DRA-007","DRA-008","DRA-014"]
    source_ids: ["SRC-ARIS-POE","SRC-CHEK-PLAY","SRC-LAND-TALK"]
    confidence: "high"
  - rule_id: "DIR-001"
    domain: "directing"
    name: "Name the intended viewer experience"
    type: "creative_heuristic"
    priority: 1
    origin: "AFI Director's Craft and NFTS script interpretation."
    principle: "For each scene, name what the viewer should notice, understand and feel by the exit. Separate this intention from the character's goal."
    why_it_works: "One purpose can coordinate performance, staging, camera, sound and the cut."
    when_to_apply: "Before boards and whenever a scene has conflicting notes."
    when_to_break: "A scene may deliberately sustain ambiguity. State which facts stay legible and what interpretations remain open."
    good_example: "A calm introduction should become uneasy when the guest recognizes a detail."
    common_mistake: "Using a mood adjective as the whole directing brief."
    ai_implementation: "Record the intended viewer change, evidence beat, and craft choices serving it."
    validation: "Each major shot or cue can name a contribution. Remove or revise choices with conflicting purposes."
    related_rules: ["DIR-002","DIR-005","DIR-010","DRA-005"]
    source_ids: ["SRC-AFI-DIR","SRC-NFTS-DIR"]
    confidence: "high"
  - rule_id: "DIR-002"
    domain: "directing"
    name: "Choose narrative access and camera viewpoint"
    type: "established_technique"
    priority: 1
    origin: "Bordwell on access to story information and AFI on narrative point of view."
    principle: "Choose whose experience anchors a beat, what the viewer knows, and when camera or sound aligns with that perspective."
    why_it_works: "A controlled viewpoint guides knowledge and emotional alignment even without a literal eye view."
    when_to_apply: "Reveals, contested information and changes of alignment."
    when_to_break: "Switch viewpoints for irony, contrast or an intentional rupture. Give the viewer a cue at the switch."
    good_example: "Stay with a speaker until a listener hears a significant off-screen sound, then shift auditory attention."
    common_mistake: "Making a literal POV shot for every moment of subjective experience."
    ai_implementation: "For each beat store focal character, visible and audible access, optical viewpoint, and change cue."
    validation: "Recount what the viewer and focal character know after the beat. Check for accidental spoilers."
    related_rules: ["DIR-001","DIR-007","DIR-009","DRA-010"]
    source_ids: ["SRC-BORD-BOMB","SRC-AFI-DIR"]
    confidence: "high"
  - rule_id: "DIR-003"
    domain: "directing"
    name: "Direct with a playable action"
    type: "established_technique"
    priority: 1
    origin: "Stanislavski's action work and Weston's process-oriented tools."
    principle: "Give the performer a verb aimed at a target and a reason to try it now."
    why_it_works: "The actor or generation planner has a behavior to pursue and can react if it fails."
    when_to_apply: "When the brief names a state such as sad, angry or mysterious."
    when_to_break: "A stylized tableau can use poses as intentional graphic signs. Name the intended image and duration."
    good_example: "Ask the performer to reassure a witness while avoiding the witness's question."
    common_mistake: "Stacking adjectives without an objective or counterpart."
    ai_implementation: "Translate an intention into a target, visible tactic and response. Carry one action priority into the clip prompt."
    validation: "A viewer can describe something the performer tries to do and where their attention is directed."
    related_rules: ["DIR-004","DIR-005","DIR-006","DRA-003"]
    source_ids: ["SRC-STAN-ACT","SRC-WEST-TOOLS"]
    confidence: "high"
  - rule_id: "DIR-004"
    domain: "directing"
    name: "Use given circumstances"
    type: "established_technique"
    priority: 2
    origin: "Stanislavski's предлагаемые обстоятельства, adapted to a performance brief."
    principle: "Identify facts of place, relationship, preceding event and immediate constraints that affect this action."
    why_it_works: "The same words and gesture play differently under different conditions."
    when_to_apply: "Actor notes, scene interpretation and continuity across separately generated shots."
    when_to_break: "An intentionally abstract performance may omit literal history. Preserve the conditions that actually shape it."
    good_example: "A speaker keeps her voice low because the person she is discussing is behind a thin door."
    common_mistake: "Writing a complete biography when one relevant fact would change the performance."
    ai_implementation: "Keep a short circumstances list and convert each relevant item into a visible or audible consequence."
    validation: "Every circumstance carried into the prompt changes a choice, motion, position or sound."
    related_rules: ["DIR-003","DIR-006","DIR-008"]
    source_ids: ["SRC-STAN-ACT","SRC-WEST-TOOLS"]
    confidence: "high"
  - rule_id: "DIR-005"
    domain: "directing"
    name: "Find beats through changed tactics"
    type: "established_technique"
    priority: 1
    origin: "Weston on emotional events and McKee on scene changes."
    principle: "Mark a new beat when the character changes tactic, registers information or shifts the relationship."
    why_it_works: "Performance has legible turning points the camera and edit can support."
    when_to_apply: "Dialogue, physical tasks and rehearsals with several intentions."
    when_to_break: "Hold across a subtle turn when the audience benefits from discovering it within a sustained take."
    good_example: "A joke becomes a request after it draws no response."
    common_mistake: "Marking a cut at every line regardless of what the relationship does."
    ai_implementation: "Write action, trigger, reaction and exit state. Group consecutive beats into one generation only if the planned action stays feasible."
    validation: "Identify the first observable sign of each turn in the board or animatic."
    related_rules: ["DIR-001","DIR-003","DIR-007","DIR-012","DRA-005"]
    source_ids: ["SRC-WEST-TOOLS","SRC-MCK-TURN","SRC-AFI-DIR"]
    confidence: "high"
  - rule_id: "DIR-006"
    domain: "directing"
    name: "Convert performance notes into observable behavior"
    type: "creative_heuristic"
    priority: 1
    origin: "Rulebook translation of Weston's physical-life and action tools."
    principle: "Keep the inner intention in direction notes and choose a few visible or audible cues for the shot."
    why_it_works: "Concrete movement, gaze, breath or stillness can be reviewed across takes."
    when_to_apply: "Image and motion prompts and independent generation of adjacent shots."
    when_to_break: "A mask or long shot may require a larger body action. Use the minimum amplitude the framing can convey."
    good_example: "A hand begins reaching, stops short, and stays still while attention shifts to the listener."
    common_mistake: "Requesting several facial, hand and camera events in the same instant."
    ai_implementation: "Separate actor intent, observable cue, timing order and end state. Pick the strongest cue when the shot is crowded."
    validation: "Check in context at intended size and speed. The cue should be legible and leave the next shot in a compatible state."
    related_rules: ["DIR-003","DIR-004","DIR-008","DIR-010"]
    source_ids: ["SRC-WEST-TOOLS","SRC-AFI-DIR"]
    confidence: "medium"
  - rule_id: "DIR-007"
    domain: "directing"
    name: "Direct the listening and reaction"
    type: "established_technique"
    priority: 2
    origin: "Weston's relationship-based approach and Chekhov's use of pauses."
    principle: "Plan when a listener receives a cue, how they register it and whether the viewer sees that response."
    why_it_works: "A scene's meaning can change in the recipient while the speaker continues."
    when_to_apply: "Negotiations, withholding, persuasion and off-screen speech."
    when_to_break: "Hold on the speaker if their risk or loss of certainty is the key experience. Use sound or a later reaction to clarify."
    good_example: "Let an answer continue off-screen as the listener lowers an object they were about to hand over."
    common_mistake: "Cutting mechanically to the person who speaks each line."
    ai_implementation: "Add a reaction owner, trigger, delay, action, and optional cut candidate. Preserve listening state across shots."
    validation: "Watch without dialogue or listen without picture, then check whether the intended relationship turn survives the full cut."
    related_rules: ["DIR-002","DIR-005","DIR-012","DRA-012","DRA-014"]
    source_ids: ["SRC-WEST-TOOLS","SRC-CHEK-PLAY"]
    confidence: "high"
  - rule_id: "DIR-008"
    domain: "directing"
    name: "Rehearse the physical impulse"
    type: "established_technique"
    priority: 3
    origin: "Michael Chekhov's psychological gesture, with a film planning adaptation."
    principle: "Explore a larger physical gesture that expresses the character's drive, then decide what trace belongs in the performance."
    why_it_works: "A whole-body impulse can give a subtle gesture coherent direction."
    when_to_apply: "Stylized performances and scenes where internal conflict needs a physical expression."
    when_to_break: "Use straightforward task action when a formal exercise would distract or when the gesture is meant to stay overt."
    good_example: "Explore gathering something toward the chest, then express that impulse through a small change in the grip."
    common_mistake: "Putting a large rehearsal exercise on screen when the close framing calls for restraint."
    ai_implementation: "Keep the exercise in prep and specify the visible trace, its timing, and intensity in the shot."
    validation: "The result reads as motivated physical behavior and fits the framing and the scene's tone."
    related_rules: ["DIR-003","DIR-004","DIR-006"]
    source_ids: ["SRC-MCHEK-TECH","SRC-WEST-TOOLS"]
    confidence: "medium"
  - rule_id: "DIR-009"
    domain: "directing"
    name: "Block action to guide attention"
    type: "established_technique"
    priority: 1
    origin: "AFI cinematic storytelling and NYU staging practice."
    principle: "Use position, orientation, depth, contrast and timed movement to control when a viewer notices each important action."
    why_it_works: "The audience can find the action within a frame and understand who can see what."
    when_to_apply: "Group scenes, entrances and reveals in a single shot."
    when_to_break: "Give the viewer several simultaneous choices when wandering attention is part of the effect. Keep necessary facts recoverable."
    good_example: "A quiet background figure steps into an unobstructed pool of light only after the foreground action stops."
    common_mistake: "Animating every person and every prop through the decisive gesture."
    ai_implementation: "Mark the attention target at each beat, movement cue, relative depth and planned occlusion."
    validation: "A viewer can point to the intended subject at the key moment without needing a verbal explanation."
    related_rules: ["DIR-001","DIR-002","DIR-010","DIR-011"]
    source_ids: ["SRC-AFI-DIR","SRC-NYU-GRAD","SRC-BLOCK-VIS"]
    confidence: "high"
  - rule_id: "DIR-010"
    domain: "directing"
    name: "Give the camera and cut a reason"
    type: "established_technique"
    priority: 1
    origin: "AFI Director's Craft and Bordwell's account of narrative access."
    principle: "Tie shot size, movement, camera placement and the cut to a dramatic purpose such as reveal, reaction, clarity or duration."
    why_it_works: "Camera emphasis can strengthen a beat or draw attention away from it."
    when_to_apply: "Shot-list review and motion prompt design."
    when_to_break: "A formal move may set rhythm, establish a pattern or make the camera felt. State the planned effect."
    good_example: "A camera shift reveals who heard the exchange once that knowledge matters."
    common_mistake: "Adding a smooth orbit merely because the tool supports movement."
    ai_implementation: "Record the purpose, start target, movement trigger, final target and the option of holding the frame."
    validation: "Compare the shot to a locked version. Keep the move when it adds the intended information, relation or experience."
    related_rules: ["DIR-001","DIR-002","DIR-006","DIR-009","DIR-014"]
    source_ids: ["SRC-AFI-DIR","SRC-BORD-BOMB"]
    confidence: "high"
  - rule_id: "DIR-011"
    domain: "directing"
    name: "Make the setting act on the scene"
    type: "established_technique"
    priority: 2
    origin: "Hitchcock's AFI setting example and BFI analysis of Kurosawa's weather."
    principle: "Choose a feature of the location, prop or environment that alters an action or the viewer's reading of it."
    why_it_works: "The scene becomes specific to its world and can reveal information through cause and effect."
    when_to_apply: "Location-led scenes, obstacles, reveals and action design."
    when_to_break: "A stripped set can express abstraction. Treat absence of detail as part of the design."
    good_example: "A gust interrupts a handoff and forces a character to reveal which paper matters."
    common_mistake: "Adding atmospheric weather that changes between shots without a dramatic or physical reason."
    ai_implementation: "Link the environmental cue to an action and store its direction, state and continuity requirement."
    validation: "Explain what would change if the setting feature disappeared. Check that it persists across relevant shots."
    related_rules: ["DIR-004","DIR-009","DIR-013","DRA-011"]
    source_ids: ["SRC-HITCH-AFI","SRC-KURO-WEATH"]
    confidence: "high"
  - rule_id: "DIR-012"
    domain: "directing"
    name: "Shape tension and release through duration"
    type: "creative_heuristic"
    priority: 2
    origin: "Tarkovsky on filmed time and Weston's moment-by-moment process."
    principle: "Choose where the scene should tighten, hold or release. Let action, listening, silence or sustained observation create the duration."
    why_it_works: "Duration changes how much anticipation and reflection a viewer can experience."
    when_to_apply: "Tense exchanges, waiting, reactions and edits that feel hurried."
    when_to_break: "A hard cut can deny release or create shock when that is the stated intention."
    good_example: "Hold a listener long enough to see a decision form, then cut after their response begins."
    common_mistake: "Assigning a fast or slow tempo to every shot from a genre label."
    ai_implementation: "Write pressure change and the cue that justifies each hold or cut. Test alternatives in the animatic."
    validation: "Time the beat in context and compare an earlier and later cut. Choose by the intended experience."
    related_rules: ["DIR-005","DIR-007","DIR-014","DRA-014","DRA-017"]
    source_ids: ["SRC-TARK-ESSAY","SRC-WEST-TOOLS","SRC-AFI-DIR"]
    confidence: "medium"
  - rule_id: "DIR-013"
    domain: "directing"
    name: "Use contrast to express a turn"
    type: "established_technique"
    priority: 2
    origin: "Block's visual contrast and AFI's integration of image with story."
    principle: "Change one or more perceptible relations across a beat, such as distance, movement, tonal value or density, when it serves the intention."
    why_it_works: "A perceptible contrast makes a change in the situation easier to feel or recognize."
    when_to_apply: "Turns, shifts of power and transitions between emotional states."
    when_to_break: "Continuity or stillness can make a hidden change more troubling. Find evidence in behavior or sound."
    good_example: "Two figures share an even two-shot until one withdraws and the empty space becomes conspicuous."
    common_mistake: "Changing camera, lighting and movement together without knowing which one expresses the shift."
    ai_implementation: "Specify the before/after contrast and which element carries it. Preserve unrelated scene anchors."
    validation: "A side-by-side comparison shows the intended change and preserves the necessary identity and geography."
    related_rules: ["DIR-001","DIR-009","DIR-010","DIR-012"]
    source_ids: ["SRC-BLOCK-VIS","SRC-AFI-DIR"]
    confidence: "high"
  - rule_id: "DIR-014"
    domain: "directing"
    name: "Rehearse transitions and minimum coverage"
    type: "creative_heuristic"
    priority: 1
    origin: "Lumet's rehearsal account, AFI exercises and NFTS expressive editing."
    principle: "Walk through the scene from entry state to exit, then plan the shots and transitions needed for the intended cut."
    why_it_works: "A rehearsal can find missing geography, reaction, action overlap or a sound bridge before expensive generation."
    when_to_apply: "Before motion production and when a one-take plan is brittle."
    when_to_break: "A long take can carry the full beat if performance and spatial action remain legible. Identify an edit recovery point if feasible."
    good_example: "Board the handoff, the receiver's reaction and an exit cue. Test a sound overlap into the next scene."
    common_mistake: "Generating every angle without a plan for where they would cut together."
    ai_implementation: "Mark exit-to-entry link, coverage purpose, overlaps, room tone and fallback. Favor a small reference test before full generation."
    validation: "Assemble the boards in order. Check the turn, axis, action match and audio bridge without relying on missing footage."
    related_rules: ["DIR-005","DIR-009","DIR-010","DIR-012","DRA-015"]
    source_ids: ["SRC-LUM-TALK","SRC-AFI-DIR","SRC-NFTS-DIR"]
    confidence: "high"
