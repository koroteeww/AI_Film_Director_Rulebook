e="17" font-weight="700" fill="#e7b67e">01 · West door</text><text x="666" y="159" font-family="DejaVu Sans, sans-serif" font-size="12" font-weight="400" fill="#eaece6">Fixed amber light and entrance.</text><text x="666" y="202" font-family="DejaVu Sans, sans-serif" font-size="17" font-weight="700" fill="#e7b67e">02 · Bench</text><text x="666" y="225" font-family="DejaVu Sans, sans-serif" font-size="12" font-weight="400" fill="#eaece6">Recorder west. Papers and radio east.</text><text x="666" y="268" font-family="DejaVu Sans, sans-serif" font-size="17" font-weight="700" fill="#e7b67e">03 · North rail</text><text x="666" y="291" font-family="DejaVu Sans, sans-serif" font-size="12" font-weight="400" fill="#eaece6">Both men go north after the report.</text><text x="666" y="334" font-family="DejaVu Sans, sans-serif" font-size="17" font-weight="700" fill="#e7b67e">04 · Profile</text><text x="666" y="357" font-family="DejaVu Sans, sans-serif" font-size="12" font-weight="400" fill="#eaece6">East end, from inside the rail.</text><text x="32" y="463" font-family="DejaVu Sans, sans-serif" font-size="14" font-weight="400" fill="#eaece6">Keep the ridge and the school window in the same direction as the field of view opens.</text></svg>
